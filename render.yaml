services:
  - type: web
    name: marathon-app
    env: static
    buildCommand: ""
    staticPublishPath: .
    # The whole app is one HTML file that changes whenever the plan changes.
    # Without this the browser serves a stale plan and the runner trains the
    # wrong session. no-cache = revalidate every load, not "never cache".
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: marathon-coach
    env: node
    rootDir: proxy
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://marathon-app.onrender.com
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
