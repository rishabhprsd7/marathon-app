      --ink-2:      #0D1720;
      --ink-3:      #13202E;
      --line:       rgba(248,241,222,0.13);
      --line-warm:  rgba(245,160,40,0.40);
      --paper:      #F7F0DC;
      --paper-2:    #EDE0C4;
      --paper-mute: rgba(247,240,220,0.75);
      --paper-dim:  rgba(247,240,220,0.52);
      --paper-faint:rgba(247,240,220,0.30);
      --amber:      #F5A028;
      --amber-hot:  #FFBA4D;
      --amber-deep: #C97820;
      --amber-tint: rgba(245,160,40,0.18);
      --sage:       #5EC95A;
      --sage-deep:  #2E8F30;
      --rust:       #FF5A35;
      --bone:       #FBF5E6;
      --shadow-warm:0 1px 0 rgba(247,240,220,0.05) inset, 0 12px 28px -16px rgba(0,0,0,0.65), 0 1px 0 rgba(0,0,0,0.45);
    }

    *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ background:var(--ink); color:var(--paper); }
    html{ font-size:16px; -webkit-text-size-adjust:100%; }
    body{
      font-family:'Plus Jakarta Sans', system-ui, sans-serif;
      font-feature-settings:'ss01','cv11';
      letter-spacing:-0.005em;
      min-height:100vh;
      min-height:100svh;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(245,160,40,0.16), transparent 60%),
        radial-gradient(900px 600px at 100% 100%, rgba(20,40,70,0.35), transparent 60%),
        var(--ink);
    }
    button{ cursor:pointer; font-family:inherit; color:inherit; }
    textarea{ font-family:'Plus Jakarta Sans', system-ui, sans-serif; }

    /* Paper-noise texture for tactile cards */
    .grain{
      position:relative;
      isolation:isolate;
    }
    .grain::before{
      content:"";
      position:absolute; inset:0;
      pointer-events:none;
      border-radius:inherit;
      opacity:0.35;
      mix-blend-mode:overlay;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95 0 0 0 0 0.91 0 0 0 0 0.82 0 0 0 0.5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }
    .grain-dark::before{
      opacity:0.18;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.05 0 0 0 0 0.08 0 0 0 0 0.12 0 0 0 0.45 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    /* Scrollbars */
    ::-webkit-scrollbar{ width:7px; height:7px; }
    ::-webkit-scrollbar-track{ background:transparent; }
    ::-webkit-scrollbar-thumb{ background:rgba(241,232,210,0.16); border-radius:4px; }

    /* Selection */
    ::selection{ background:var(--amber); color:var(--ink); }

    /* Sticky tabs */
    .tabbar{
      position:sticky; top:0; z-index:80;
      backdrop-filter:saturate(140%) blur(14px);
      -webkit-backdrop-filter:saturate(140%) blur(14px);
      background:linear-gradient(180deg, rgba(12,20,28,0.92), rgba(12,20,28,0.82));
      border-bottom:1px solid var(--line);
    }

    /* Custom checkbox — the satisfying tick */
    .runcheck{
      position:relative;
      width:28px; height:28px;
      border-radius:50%;
      border:1.5px solid rgba(241,232,210,0.28);
      background:rgba(241,232,210,0.04);
      flex-shrink:0;
      display:grid; place-items:center;
      transition:transform .18s cubic-bezier(.34,1.56,.64,1), background .25s, border-color .25s, box-shadow .25s;
    }
    .runcheck:hover{
      border-color:var(--amber);
      transform:scale(1.06);
    }
    .runcheck:active{ transform:scale(.92); }
    .runcheck svg{
      width:14px; height:14px;
      stroke:var(--ink); stroke-width:3; fill:none;
      stroke-linecap:round; stroke-linejoin:round;
      stroke-dasharray:20; stroke-dashoffset:20;
      transition:stroke-dashoffset .35s cubic-bezier(.34,1.56,.64,1) .05s;
    }
    .runcheck.is-done{
      background:var(--amber);
      border-color:var(--amber);
      box-shadow:0 0 0 5px var(--amber-tint), 0 8px 24px -4px var(--amber);
    }
    .runcheck.is-done svg{ stroke-dashoffset:0; }
    .runcheck.is-done::after{
      content:"";
      position:absolute; inset:-6px;
      border-radius:50%;
      border:2px solid var(--amber);
      opacity:0;
      animation:ringPulse .55s ease-out;
    }
    @keyframes ringPulse{
      0%{ transform:scale(.6); opacity:0.6; }
      100%{ transform:scale(1.25); opacity:0; }
    }

    /* Hero number tabular alignment */
    .data-num{
      font-family:'Space Grotesk','Plus Jakarta Sans', sans-serif;
      font-feature-settings:'tnum','lnum';
      letter-spacing:-0.04em;
      line-height:0.9;
    }
    .data-num-tight{
      font-family:'Space Grotesk','Plus Jakarta Sans', sans-serif;
      font-feature-settings:'tnum','lnum';
      letter-spacing:-0.02em;
    }
    .serif{ font-family:'DM Serif Display', Georgia, serif; font-weight:400; }
    .serif-i{ font-family:'DM Serif Display', Georgia, serif; font-style:italic; font-weight:400; }
    .mono-cap{
      font-family:'Plus Jakarta Sans', sans-serif;
      font-weight:700;
      letter-spacing:0.20em;
      text-transform:uppercase;
      font-size:10px;
    }

    /* Phase pip & chips */
    .chip{
      display:inline-flex; align-items:center; gap:6px;
      padding:3px 9px;
      border-radius:999px;
      font-family:'Plus Jakarta Sans', sans-serif;
      font-size:10.5px; font-weight:600;
      letter-spacing:0.04em;
      background:rgba(241,232,210,0.06);
      border:1px solid rgba(241,232,210,0.10);
      color:var(--paper-mute);
      white-space:nowrap;
    }
    .chip .pip{ width:7px; height:7px; border-radius:50%; }
    .chip-amber{ color:var(--amber-hot); background:rgba(245,160,40,0.14); border-color:rgba(245,160,40,0.45); }
    .chip-sage { color:#7EE07A; background:rgba(94,201,90,0.12); border-color:rgba(94,201,90,0.42); }
    .chip-rust { color:#FF8060; background:rgba(255,90,53,0.12); border-color:rgba(255,90,53,0.42); }

    /* Pulsing today dot */
    .live{ position:relative; }
    .live::after{
      content:""; position:absolute; right:-10px; top:50%;
      width:6px; height:6px; border-radius:50%;
      background:var(--amber);
      box-shadow:0 0 0 0 var(--amber);
      transform:translateY(-50%);
      animation:pulse 1.8s ease-out infinite;
    }
    @keyframes pulse{
      0%  { box-shadow:0 0 0 0 rgba(245,160,40,0.85); }
      70% { box-shadow:0 0 0 10px rgba(245,160,40,0); }
      100%{ box-shadow:0 0 0 0 rgba(245,160,40,0); }
    }

    /* Card base */
    .card{
      background:linear-gradient(180deg, rgba(241,232,210,0.04), rgba(241,232,210,0.015));
      border:1px solid var(--line);
      border-radius:14px;
      box-shadow:var(--shadow-warm);
    }
    .card-warm{
      background:linear-gradient(180deg, rgba(229,152,73,0.10), rgba(229,152,73,0.03));
      border:1px solid var(--line-warm);
      box-shadow:0 12px 32px -18px rgba(229,152,73,0.5), 0 1px 0 rgba(0,0,0,0.4);
    }

    textarea.note{
      width:100%;
      background:rgba(12,20,28,0.55);
      border:1px solid var(--line);
      border-radius:10px;
      padding:10px 12px;
      color:var(--paper);
      font-size:13px;
      line-height:1.55;
      resize:none;
      height:72px;
      outline:none;
    }
    textarea.note:focus{ border-color:var(--amber); }

    .btn{
      display:inline-flex; align-items:center; gap:6px;
      padding:8px 14px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(241,232,210,0.05);
      color:var(--paper);
      font-size:12px; font-weight:600;
      letter-spacing:0.02em;
      transition:all .18s ease;
    }
    .btn:hover{ background:rgba(241,232,210,0.1); border-color:rgba(241,232,210,0.22); }
    .btn-amber{
      background:var(--amber); color:var(--ink); border-color:var(--amber);
      box-shadow:0 8px 24px -10px var(--amber);
    }
    .btn-amber:hover{ background:var(--amber-hot); border-color:var(--amber-hot); }
    .btn-ghost{ background:transparent; }

    .divider-warm{ height:1px; background:linear-gradient(90deg, transparent, var(--line-warm), transparent); }

    /* Stat ticks under hero progress */
    .ticks{
      display:grid;
      grid-template-columns:repeat(19,1fr);
      gap:2px;
      height:6px;
    }
    .ticks div{
      background:rgba(241,232,210,0.10);
      border-radius:1px;
      transition:background .3s;
    }

    /* Animations on tab change */
    .fade-in{ animation:fadeUp .35s ease-out; }
    @keyframes fadeUp{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
    @keyframes spin{ to{ transform:rotate(360deg); } }
    @keyframes bob{
      0%,100%{ transform:translateY(0); opacity:0.35; }
      50%{ transform:translateY(-4px); opacity:1; }
    }

    @media (min-width:720px){
      .container{ max-width:760px; margin:0 auto; }
    }
  </style>
</head>

/* ───────── DATES ───────── */
const WEEK1_START = new Date("2026-05-25");
const RACE_DATE   = new Date("2026-10-04");
const TODAY       = new Date();
TODAY.setHours(0,0,0,0);
const DTR = Math.max(0, Math.floor((RACE_DATE - TODAY) / 86400000));
const STORAGE_PREFIX = "hm2025_";

function runDate(week, day){
  const off = { Mon:0, Tue:1, Wed:2, Thu:3, Fri:4, Sat:5, Sun:6 };
  const d = new Date(WEEK1_START);
  d.setDate(d.getDate() + (week-1)*7 + (off[day] ?? 0));
  return d;
}
function fmt(d){ return new Date(d).toLocaleDateString("en-GB",{ day:"numeric", month:"short" }); }
function fmtLong(d){ return new Date(d).toLocaleDateString("en-GB",{ weekday:"long", day:"numeric", month:"long" }); }
function weekRange(weekNum){
  const s = new Date(WEEK1_START); s.setDate(s.getDate() + (weekNum-1)*7);
  const e = new Date(s); e.setDate(s.getDate() + 6);
  const sameMonth = s.getMonth() === e.getMonth();
  const sd = s.toLocaleDateString("en-GB",{day:"numeric"});
  const ed = e.toLocaleDateString("en-GB",{day:"numeric", month:"short"});
  return sameMonth ? `${sd}–${ed}` : `${s.toLocaleDateString("en-GB",{day:"numeric",month:"short"})} – ${ed}`;
}
function isToday(d){ const x=new Date(d); x.setHours(0,0,0,0); return x.getTime()===TODAY.getTime(); }
function isPast(d){ const x=new Date(d); x.setHours(0,0,0,0); return x.getTime()<TODAY.getTime(); }

function watchCfg(i, t){
  if (!i || !t) return null;
  if (/race|rest/i.test(i) || i.startsWith("Race-pace") || i.startsWith("5K TUNE")) return null;
  /* Split sessions change ratio mid-run, so a single derived set count would
     contradict the breakdown in the note. Let the note speak instead. */
  if (/\bthen\b/i.test(i)) return null;
  const parseSecs = s => { const m=s.match(/(\d+)\s*min/); if(m) return +m[1]*60; const x=s.match(/(\d+)\s*s/); return x?+x[1]:null; };
  const slash = i.indexOf("/");
  if (slash < 0) return null;
  const run = parseSecs(i.slice(0, slash));
  const walk = parseSecs(i.slice(slash + 1));
  if (!run || !walk) return null;
  const tm = t.match(/~?(\d+)\s*min/);
  if (!tm) return null;
  const hasFinisher = i.includes("finisher");
  /* finisher sessions: last ~15% of session is open continuous run — subtract before counting sets */
  /* Every session opens with a 5-minute walk warm-up that is not part of the
     interval block. Subtract it, or the derived set count overstates by ~2-4
     and contradicts the rep count in the note. */
  const WARMUP_SECS = 300;
  const totalSecs = Math.max(0, +tm[1] * 60 * (hasFinisher ? 0.82 : 1) - WARMUP_SECS);
  const sets = Math.round(totalSecs / (run+walk));
  const fmt = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
  return { run: fmt(run), walk: fmt(walk), sets, approx: hasFinisher };
}

    {d:"Sat",i:"60s run / 90s walk", t:"79 min",km:"~9.0km",n:"⚡ RATIO UPGRADE — run blocks to 60s, the first step of the 2:45 build. Trimmed 9.5→9.0 because you've already run 6.92 + 7.35km this week. Still +22% on your longest (7.38km), so respect it. BRISK WALKS at 10:00/km — that habit is worth ~15 min on race day. 🔄 FORM CHECKPOINT AT 5KM: that's where your posture starts to collapse and your shins pay for it. From 5km on, use every single walk break to stand tall and reset, then run the next block with quick light feet. Eat ~2h before, carry water, cool part of the day. Abort at 7km if you're struggling; that's still a good session."}]},

  {w:16,phase:"Final build",shoe:"Duramo SL2",deload:false,runs:[
    {d:"Tue",i:"60s run / 90s walk", t:"50 min",km:"~6.0km",n:"⏱ 18 REPS — warmup 300s, then 60s run / 90s walk ×18. Six days since the last run. Duramos, sleeves if you have them. Target 148m per run leg and 150m per walk leg — roughly equal distance in each. Your app shows per-leg distance; check a couple mid-run. Pain ≤3/10 or stop."},
    {d:"Thu",i:"45s run / 90s walk", t:"34 min",km:"~4.0km",n:"✅ DEFAULT IS RUN — 4km, 13 reps of 45s/90s, Duramos, deliberately slow. Both orthopedists diagnosed TENDINOPATHY and neither ordered imaging, so a discrete tender point along the tendon is expected rather than alarming. Controlled load is the treatment. Shorter run legs than usual = less time loaded.\n\n⚕️ ONE THING OVERRIDES THIS: run a thumb along the inner edge of the shin BONE. A single coin-sized spot on the BONE that makes you flinch (not the soft tissue beside it) → swap to 45 min spinning and book the orthopedist before Wednesday. Bone and tendon respond to load in opposite directions; that is the only reason to check.\n\nNo balm before the run — it masks the signal. Rehab afterwards: isometric holds, banded inversion, clamshells. Skipping those after Tuesday is what preceded this."},
    {d:"Sat",i:"60s/90s to 5km, then 45s/90s", t:"76 min",km:"~9.0km",n:"⚑ SPLIT THE RATIO AT YOUR FORM CEILING. 17 reps of 60s/90s for the first 5km, then switch to 45s/90s for the last 4km — 15 reps. Your form has now collapsed at 5km twice (15 Aug, 8 Sep), and the last 4km is exactly where a 9km run would otherwise be run on broken form. Shorter run legs = less time loaded in a bad position. Costs about 1 minute. Targets: run leg 148m then 111m; walk leg 150m throughout. ABORT AT 6KM if pain passes 3/10. Eat 2h before, carry water, cool part of the day."}]},
  {w:17,phase:"Peak",shoe:"Duramo SL2",deload:false,runs:[
    {d:"Mon",i:"60s run / 90s walk", t:"42 min",km:"~5.0km",n:"Tuesday moved to Monday, giving a clear day before the B2Run. 👟 THIS is the Boston 12 test run — short, two days before the race, with time to react if they do not suit. If the shins say anything at all, the B2Run is in the Duramos. Easy: 148m run legs, 150m walk legs."},
    {d:"Wed",i:"B2RUN BERLIN — 5.7km", t:"~47 min",km:"5.7km",n:"🏁 Capgemini B2Run, 6km. RUN IT AS A TRAINING SESSION, NOT A RACE — 60s/90s from the first minute, in the DURAMOS. 👟 Shoe question settled by Monday's test: the Boston 12s gave left-ankle pain on the injured side, so they are out. Duramos, no further discussion. It falls three days before your 12km go/no-go, and a hard 6km with colleagues would wreck that. Everyone around you will sprint off; let them. If you race it instead, tell me and Saturday drops to 9km. 📋 COURSE IS 5.7km. ONE SETTING THE WHOLE WAY: 60s run / 90s walk, reps 999, auto-pause OFF. No mid-race reconfiguration — at 5.7km the 45/90 block would have been a single rep, not worth the fumble.\n\n⚡ 148m PER RUN LEG (6:45/km) · 150m PER WALK LEG (10:00/km, arms driving). Adrenaline will push you to 160m+ in the first three reps; that is the one thing that can spoil this. Glance at rep 2 and rep 3 and pull it back.\n\n🔢 SETS: 18, or 17 if you are running hot. ONE GLANCE AT THE 5km MARKER DECIDES IT — elapsed 41:00 or more, run 18; under 41:00, stop at 17. (On-target pace reaches 5km at 41:56, Monday's pace at 40:42, hammering at 39:03.) 18 is a hard ceiling: run hot and 18 sets covers 5760m, overshooting the course. 18 sets leaves a 336m push, 17 leaves 481m — both inside the 500m limit, both past 5km.\n\n💡 WHY DISCIPLINE IS FREE HERE: disciplined 148m legs finish in 47:07. Hammering 165m legs finish in 44:03. Running EVERY leg 11% harder for 45 minutes buys three minutes, because the walk breaks dominate the clock. Three minutes, three days before the go/no-go. Worst trade on offer today.\n\n🏁 THE FINISH: end the plan at your set count and RUN THE LAST 336-481m CONTINUOUSLY to the line — about 2:40, roughly 2.7x your 60s habit, and it begins AFTER the 5km zone where your form collapses rather than at it. Go faster with CADENCE, NOT STRIDE: short quick steps, more of them. Lengthening your stride is overstriding, and overstriding is exactly how the tibialis gets loaded. Do not sprint.\n\n⏱ Roughly 17 reps to the 5km marker, 18 total, finishing around 47 min.\n\n⚕️ IF THE ANKLE OR SHIN SAYS ANYTHING: skip the continuous finish and walk-break to the line. Saturday is the go/no-go for the whole race and you get one shot at it."},
    {d:"Sat",i:"45s run / 90s walk", t:"86 min",km:"~10.0km",n:"🏅 IF GREEN THIS IS THE LONGEST RUN OF HIS LIFE — 10.0km against a 9.18km best. He asked for 12km today; the 12 lands on 26.09 instead, at 13km.\n\n⛔ WHY NOT 12 TODAY: the B2Run was three days ago, raced at 41% above 163 bpm, and it left a calf that hurt to a fingertip. Soft tissue at day three is in early repair and is WEAKER than normal, not yet stronger. 12km would also be +31% over his longest ever. Either alone is survivable; both on the same day is how you miss the start line. 10km is +9% and costs nothing.\n\n🚦 PRESS-TEST THE LEFT CALF FIRST THING, before anything touches it. 🟢 No pain to LIGHT touch, ankles quiet on stairs, 10 calf raises clean → 10km, 38 reps. 🟡 Sore to FIRM pressure only → 6km, 23 reps. 🔴 Light-touch pain still there → 4km, 18 reps of 30s/90s on flat ground. 🛑 Limping → 45-minute brisk walk, the only branch without running.\n\n⚡ 45s/90s THE WHOLE WAY, even at 10km — shorter run legs mean less continuous calf loading, which is the entire point three days after a strain. One config, no mid-run switching. 111m per run leg, 150m per walk leg, NON-NEGOTIABLE. Speed is what did this to the calves; if you look down and see 130m legs you are running the B2Run again.\n\n🧦 Compression socks on if they passed the gradient test. Sleeves AFTER, not during.\n\n🛑 Abort if the calf pain SHARPENS (dull and steady is expected and fine) or your gait changes. Walk home from wherever you are."}]},
  {w:18,phase:"Final Build",shoe:"Duramo SL2",deload:false,runs:[
    {d:"Tue",i:"60s run / 90s walk", t:"42 min",km:"~5.0km",n:"Easy rebuild after the B2Run week. 148m run legs, 150m walk legs, nothing more. If the calves are still tight, walk this one and tell me — Saturday is the session that matters."},
    {d:"Thu",i:"60s run / 90s walk", t:"50 min",km:"~6.0km",n:"Easy. Last session before the go/no-go, so treat it as a rehearsal of restraint: hold 148m per run leg even though you will feel able to do more. Full rehab afterwards."},
    {d:"Sat",i:"60s/90s to 5km, then 45s/90s", t:"110 min",km:"~13.0km",n:"⚑ GO / NO-GO — 13km, THE PEAK. Moved here from 19 Sep after the B2Run left both calves tight and both ankles sore. 17 reps of 60s/90s to 5km, then 30 reps of 45s/90s for the last 8km — about 1h50. Eight days before the race, which is a normal slot for a final long run, and BIGGER than the 12km he wanted on 19 Sep. That is the trade: the peak moves LATER, not smaller.\n\n⚡ 148m PER RUN LEG for the first 5km, 111m after the switch. Aim DELIBERATELY LOW early. The B2Run is the proof of what happens when the legs decide: 166m per leg and 41% of the race above 163 bpm.\n\n👟 Full dress rehearsal — Duramos, race breakfast, sleeves, fluid every 3km.\n\n🚦 13km at ≤3/10 with no calf or ankle complaint and you start on 4 Oct. Short of it and we decide honestly. Even then a finish is available off a 10km longest run with this much walking in the plan — the walk breaks are what carry the unknown distance."}]},
  {w:19,phase:"Race Week",shoe:"Duramo SL2",deload:false,runs:[

    {d:"Thu",i:"60s run / 90s walk", t:"25 min", km:"~3.0km",n:"Final shakeout. Loose legs, then done."},
    {d:"Fri",i:"Rest",            t:"—",      km:"—",     n:"Rest. Carb-load lunch & dinner."},
    {d:"Sat",i:"Rest",            t:"—",      km:"—",     n:"Rest. Lay out gear: bib, Duramos, sleeves, phone charged, interval timer set to 60s/90s. Early to bed."},
    {d:"Sun",i:"RACE DAY",        t:"FINISH", km:"21.1km",n:"Sun Oct 4, Berlin Half, DURAMO SL2 (not the Boston 12s — firmer and plated means more lower-leg load), compression sleeves.\n\n🎯 THE GOAL IS TO FINISH. Expect ~3h–3h20. You started running in May, on a tendinitis diagnosis, and you will have covered a half marathon. The clock is irrelevant beside that.\n\n⏱ 60s run / 90s walk for the first 5km, then DROP TO 45s/90s for the remaining 16km — at the SAME pace, 111m per run leg. Holding the pace matters, but only for about 3 bpm; the far bigger driver is time on feet. Your form reliably goes at 5km, and 16km on broken form is how the tendons tear. The switch costs about 4 minutes over the whole race — cheap. Do NOT lengthen the run blocks because you feel good early; the tendons send the bill at km 15.\n\n⚡ BRISK WALK BREAKS, 10:00/km, arms driving. That habit is worth about 15 minutes across 21.1km and costs the tendons nothing.\n\nTHE FIRST 5KM DECIDE THE DAY. First walk break at minute one. Everyone will sprint past you — let them. Run legs at 6:45/km, easy enough to speak a full sentence.\n\nWalk every water station AND DRINK AT EVERY ONE. Your HR drifts ~3 bpm per 10 min even at constant pace (measured twice, 12 and 14 Sep); dehydration is the main thing making that worse, and over 3 hours it is the difference between finishing and walking the last 5km. Quick light cadence unloads both tendons.\n\nSTRUGGLING AFTER 12KM: shorten the RUN segments (60s → 45s → 30s), keep walking briskly. Keep the rhythm; don\'t stop.\n\nYour longest run will be ~12km, so the last 9km is new ground. The walk breaks carry you through it.\n\n⚕️ TAKE THE DNF IF: shin pain passes 5/10, you start limping, or your gait changes. A DNF costs one race. Running a tendon to a tear costs a year."}]},

const PREHAB_LIST = [
  {name:"Isometric Inversion Hold", sets:"5 × 30–45s", when:"DAILY — do these first", note:"⚕️ TIB. POSTERIOR REHAB, prescribed by BOTH orthopedists. Sit, loop a band round the inside of your forefoot, anchor it to the outside. Turn the sole inward against the band at ~70% effort and HOLD — don't move. Isometric holds genuinely reduce tendon pain, so do these on sore days too. The single most important thing on this list.", anchor:true},
  {name:"Banded Inversion (slow)",  sets:"3×15",   when:"Every other day", note:"⚕️ TIB. POSTERIOR REHAB. Same setup, now moving: 3 seconds turning in, 3 seconds back out. Slow and heavy remodels a tendon; fast reps do nothing. Build resistance over weeks, never in one jump. Pain along the INNER ANKLE is this same tendon — it runs behind the ankle bone into the arch, so soreness anywhere on that line is one structure, not a second injury.", anchor:true},
  {name:"Tibialis Raises",        sets:"3×20",   when:"Every run day", note:"⚕️ TIB. ANTERIOR REHAB. Back to wall, heels planted, lift toes toward your shins. Add a band round the forefoot once bodyweight feels easy, and slow it to 3s up / 3s down.", anchor:true},
  {name:"Eccentric Calf Raises", sets:"PAUSED", when:"⛔ SUSPENDED until the left calf stops hurting to light touch", note:"⛔ DO NOT DO THESE RIGHT NOW (17 Sep). Loading a calf that is tender to LIGHT TOUCH is how a grade-1 strain becomes a grade-2 one. Resume only when light touch is painless, and restart at 2×10 DOUBLE-LEG on flat ground before going back to the step edge. Until then: walk 20-30 min daily, gentle ankle circles and pumps, warmth not ice, and NO deep massage or aggressive foam rolling on the sore spot. Normal instructions, for when it is safe again: step edge, lower 3 slow seconds. Turn the foot slightly INWARD as you lower — that biases load onto tibialis posterior, the tendon that needs it. Returning from a layoff? Start 2×10 flat-footed, no slow tempo, build over ~3 weeks.", anchor:true},
  {name:"Compression Sleeves",    sets:"2 pairs", when:"Every run + after", note:"⚕️ Prescribed 28.08.26 but NOT covered by GKV — sports sleeves aren't in the Hilfsmittelverzeichnis, so the Sanitätshaus was right and this is self-pay. BUY THEM ANYWAY (€30–60/pair). 📏 SIZE BY CALF CIRCUMFERENCE AT THE WIDEST POINT, measured with a tape — not by shoe size, not by height. A loose sleeve does nothing and this is the single most common buying mistake. Want 20–30 mmHg graduated (the sports range); 15–20 is recovery-weight and too light for running. Bauerfeind Sports is German, medical-grade and easy to find here; CEP and Compressport are the other solid picks. GET TWO PAIRS so one is always clean, and consider ONE pair of full compression SOCKS with arch support for running — the arch panel supports tibialis posterior in a way a calf-only sleeve cannot. ⚠️ HONEST FRAMING, same as the balms rule: compression is a RECOVERY AID, not a treatment. The evidence for reduced soreness and faster recovery is decent; the evidence for performance is not. It will not heal a tendon. The loading work does that. \n\n\ud83e\udde6 HE OWNS FULL-LENGTH RUNNING SOCKS \u2014 STATUS UNCONFIRMED (17.09.26). Tight, and some effort to pull on, but the put-on test alone does not settle it: plenty of running socks are snug without being graduated.\n\n\ud83d\udd0d THE TEST THAT DECIDES IT: true compression is TIGHTEST AT THE ANKLE and loosens progressively up the calf \u2014 that gradient IS the mechanism. Uniformly tight, or tighter at the top, means it is just a tight sock. Supporting checks: sized by shoe size (42\u201344) = tight sock, sized by a cm range or S/M/L = compression, because real compression must be sized by leg circumference. And look for mmHg printed on the label.\n\nIF THEY PASS: socks for running (foot coverage means arch compression, which is what posterior tibialis needs and a calf-only sleeve cannot reach), sleeve for recovery and all-day wear. One pair cannot do both jobs daily \u2014 run, recover eight hours, wash, run again does not fit in a 24-hour day.\n\nIF THEY FAIL: buy running compression socks WITHIN A WEEK, so they can be run in on 26.09. New kit never debuts on race day. \ud83d\udcb0 NOT AT \u20ac50 THOUGH \u2014 that is what Seeger wanted for the Bauerfeind RUN Ultralight pair on 17.09, and it was declined as overpriced on top of the \u20ac40 sleeves. Decathlon Kiprun compression socks are \u20ac15\u201325 and do the same job; CEP and Compressport sit at \u20ac35\u201345 and discount often online. \u26a0\ufe0f KEEP THE PRIORITY STRAIGHT: the SLEEVES are the prescribed item \u2014 both orthopedists wrote sleeves, not socks. Socks are a nice-to-have, and the arch-support case for tibialis posterior is real but modest. Necessary purchase first, optional one only if it is cheap.\n\n\u26a0\ufe0f Never sleeve and sock over the same stretch of leg at once \u2014 doubled compression is too much.\n\n\u2705 BOUGHT 17.09.26 at Seeger: Bauerfeind Sports Compression Sleeves Lower Leg, \u20ac39.90 \u2014 normal RRP, correctly fitted in store. Bauerfeind sizes on TWO axes (S/M/L/XL for circumference, short/long/x-long for length), which is why buying these fitted beat ordering online. \n\n\ud83e\uddef ORTHOTICS \u2014 ASK NOW, BUY AFTER 4 OCT. A Sanit\u00e4tshaus can fit insoles with medial arch support, and for posterior tibialis tendinopathy that is a treatment-grade intervention, a level above anything compression does. But new insoles inside the taper would be the Boston 12 mistake repeated: NEVER A NEW VARIABLE IN THE LAST THREE WEEKS. Gather the information now, spend the money in October."},
  {name:"Contrast Hot/Cold",      sets:"3 rounds", when:"After every run", note:"⚕️ Prescribed by the second orthopedist 01.09.26. Alternate ~3 min warm and ~1 min cold on the lower legs, finishing cold, three rounds. Alternating dilation and constriction drives blood through the tendon, which is poorly vascularised and slow to heal. Replaces plain icing — ice alone just numbs it."},
  {name:"Belly Breathing",        sets:"5 min",  when:"Daily, lying down", note:"Hand on chest, hand on belly — only the belly hand should rise. Practising at rest makes it your default under load, so the diaphragm spasm stops recurring mid-run instead of needing to be fixed each time.", anchor:true},

/* ── Morning check-in ──────────────────────────────────────────────────────
   The 24-hour tendon rule and the resting-HR rule both depend on a number
   taken BEFORE the day's run. Nothing else in the app captures it, and it is
   the input that decides whether each session goes ahead. 15 seconds. */

const SHIN_SCALE = [0,1,2,3,4,5,6];
const LEGS_OPTS  = [{k:"fresh",l:"Fresh"},{k:"ok",l:"OK"},{k:"heavy",l:"Heavy"}];

function shinColor(v){
  if (v == null) return "rgba(247,240,220,0.12)";
  if (v <= 1) return "var(--sage)";
  if (v <= 3) return "var(--amber)";
  return "var(--rust)";
}

/* Baseline = mean of the lower half of recent readings, so a few bad nights
   can't inflate it and mask a genuine spike. */
function rhrBaseline(log){
  const vals = log.map(e=>e.rhr).filter(v=>Number.isFinite(v));
  if (vals.length < 7) return null;
  const recent = vals.slice(-14).sort((a,b)=>a-b);
  const half = recent.slice(0, Math.max(3, Math.ceil(recent.length/2)));
  return half.reduce((a,b)=>a+b,0)/half.length;
}

function checkinVerdict(log){
  if (!log.length) return null;
  const sorted = [...log].sort((a,b)=>a.date.localeCompare(b.date));
  const today = sorted[sorted.length-1];
  const prev  = sorted[sorted.length-2];

  let streak = 0;
  for (let i = sorted.length-1; i >= 0 && sorted[i].shin >= 4; i--) streak++;

  if (streak >= 3) return {tone:"var(--rust)", head:"Stop running",
    body:"Shins have been 4/10 or worse for "+streak+" days running. That's the three-bad-mornings line — book a follow-up rather than training through it."};
  if (today.shin > 5) return {tone:"var(--rust)", head:"Don't run today",
    body:"Above 5/10 is past the limit both orthopedists set. Rehab and rest only."};
  if (streak === 2) return {tone:"var(--amber)", head:"Cut the next run by a third",
    body:"Two mornings at 4/10 or worse. Reduce the next session and see if it settles."};
  if (prev && today.shin > prev.shin && today.shin >= 3) return {tone:"var(--amber)", head:"Yesterday was too much",
    body:"Worse than the morning before. The 24-hour rule says cut the next run by a third."};

  const base = rhrBaseline(sorted);
  if (base && Number.isFinite(today.rhr) && today.rhr >= base + 7)
    return {tone:"var(--amber)", head:"Under-recovered",
      body:"Resting HR "+today.rhr+" is "+Math.round(today.rhr-base)+" above your "+Math.round(base)+" baseline. Make today easy, or rest."};

  if (today.legs === "heavy") return {tone:"var(--amber)", head:"Legs are heavy",
    body:"Shins are fine, so run — but keep it genuinely easy and don't chase distance."};

  return {tone:"var(--sage)", head:"Green light",
    body:"Shins "+today.shin+"/10 and nothing flagged. Run as planned — easy legs, brisk walks."};
}

function MorningCheckIn(){
  const [log, setLog] = useState([]);
  const [open, setOpen] = useState(false);
  const [shin, setShin] = useState(null);
  const [legs, setLegs] = useState(null);
  const [rhr, setRhr]   = useState("");

  const todayKey = TODAY.toISOString().slice(0,10);

  useEffect(()=>{
    const saved = lsGet("checkin");
    if (saved) try { setLog(JSON.parse(saved)); } catch {}
  },[]);

  const todays = log.find(e => e.date === todayKey);

  const save = () => {
    if (shin === null) return;
    const entry = {date:todayKey, shin, legs, rhr: rhr === "" ? null : Number(rhr)};
    const next = [...log.filter(e=>e.date!==todayKey), entry].sort((a,b)=>a.date.localeCompare(b.date)).slice(-120);
    lsSet("checkin", JSON.stringify(next));
    setLog(next); setOpen(false);
  };

  const startEdit = () => {
    setShin(todays ? todays.shin : null);
    setLegs(todays ? todays.legs : null);
    setRhr(todays && todays.rhr != null ? String(todays.rhr) : "");
    setOpen(true);
  };

  const strip = [];
  for (let i=13; i>=0; i--){
    const d = new Date(TODAY); d.setDate(d.getDate()-i);
    const key = d.toISOString().slice(0,10);
    strip.push({key, entry: log.find(e=>e.date===key)});
  }
  const verdict = todays ? checkinVerdict(log) : null;
  const base = rhrBaseline(log);
  const rhrCount = log.filter(e=>Number.isFinite(e.rhr)).length;

  return (
    <div className="card grain grain-dark" style={{padding:"16px 16px 14px", marginBottom:18,
      borderColor: todays ? "var(--line)" : "var(--line-warm)"}}>

      <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", gap:10}}>
        <div className="mono-cap" style={{color: todays ? "var(--paper-dim)" : "var(--amber)"}}>
          Morning check-in
        </div>
        {todays && !open && (
          <button onClick={startEdit} style={{background:"transparent", border:"1px solid var(--line)",
            borderRadius:99, padding:"3px 10px", fontSize:10.5, color:"var(--paper-dim)"}}>edit</button>
        )}
      </div>

      {!todays && !open && (
        <>
          <div style={{fontSize:12.5, color:"var(--paper-mute)", marginTop:6, lineHeight:1.5}}>
            Before you get out of bed: how are the shins? This is the number that decides today's run.
          </div>
          <button onClick={startEdit} style={{marginTop:12, width:"100%", padding:"11px 0",
            borderRadius:12, border:"1px solid var(--line-warm)", background:"var(--amber-tint)",
            color:"var(--amber-hot)", fontSize:13.5, fontWeight:600}}>
            Log this morning
          </button>
        </>
      )}

      {open && (
        <div className="fade-in" style={{marginTop:12}}>
          <div style={{fontSize:11.5, color:"var(--paper-dim)", marginBottom:6}}>Shin pain when you press them</div>
          <div style={{display:"flex", gap:5}}>
            {SHIN_SCALE.map(v=>(
              <button key={v} onClick={()=>setShin(v)} style={{
                flex:1, padding:"9px 0", borderRadius:9, fontSize:13, fontWeight:600,
                fontVariantNumeric:"tabular-nums",
                border:"1px solid "+(shin===v ? shinColor(v) : "var(--line)"),
                background: shin===v ? shinColor(v) : "transparent",
                color: shin===v ? "var(--ink)" : "var(--paper-dim)"

          </div>

          <div style={{display:"flex", gap:5}}>
            {LEGS_OPTS.map(o=>(
              <button key={o.k} onClick={()=>setLegs(o.k)} style={{

          </div>

            Resting HR <span style={{color:"var(--paper-faint)"}}>· optional, H10 or band</span>
          </div>

            {strip.map(s=>(
              <div key={s.key} style={{flex:1, display:"flex", flexDirection:"column",
                justifyContent:"flex-end", height:"100%"}}>
                <div title={s.key} style={{
                  height: s.entry ? Math.max(4, (s.entry.shin/6)*30)+"px" : "3px",
                  borderRadius:3, background: shinColor(s.entry ? s.entry.shin : null)
                }}/>
              </div>
            ))}
          </div>
          <div style={{display:"flex", justifyContent:"space-between", marginTop:5,
            fontSize:10, color:"var(--paper-faint)", letterSpacing:"0.04em"}}>
            <span>14 days ago</span>
            <span>
              {base ? "resting HR baseline "+Math.round(base) : "resting HR baseline: "+rhrCount+"/7 readings"}
            </span>
            <span>today</span>
          </div>
        </div>
      )}
    </div>
  );
}

        <div style={{marginTop:14, display:"flex", flexDirection:"column", gap:12}}>
          {[
            {t:"Fever = do not run. At all.", a:"Not a judgement call. Exercising with a fever risks myocarditis — inflammation of the heart muscle — rare but serious. NECK CHECK: symptoms above the neck only (runny nose, mild sore throat) → easy running is fine. Fever, body aches, chest symptoms, deep fatigue → no running. After a fever breaks, wait 48h feeling genuinely normal, then return at HALF distance. Roughly one to two easy days back per day ill.", c:"var(--rust)"},
            {t:"Chest pain = diaphragm spasm", a:"Assessed by your GP as diaphragm spasm — a stitch. Manage it: nothing to eat 2–3h before running, breathe into the belly, alternate the foot you exhale on. GO BACK IF THE CHARACTER CHANGES — pain spreading to jaw, neck, arm or back; nausea, cold sweat, dizziness or palpitations; pain at rest or at night; or pain that no longer settles when you slow down. None of those are stitch symptoms.", c:"var(--rust)"},
            {t:"Morning HR up 7+ bpm = back off", a:"Easiest route: wear a fitness band overnight and read its resting HR — automatic beats accurate here, because what matters is the TREND against your own baseline, not the absolute number. Otherwise: wet the H10, strap on, lie still 2 min before getting out of bed, read it in Elite HRV (free) or the Polar app. Either way, two weeks gives you a baseline. Once you have it: a morning 7+ bpm above baseline means under-recovered or something brewing — make that day easy or rest, whatever the plan says. Two mornings in a row: rest. This is the objective version of the tiredness you've pushed through before.", c:"var(--amber)"},
            {t:"The 24-hour tendon rule", a:"⚕️ Diagnosed 28.08.26 and confirmed 01.09.26: tibialis anterior + posterior tendinitis, both legs. Tendons need LOAD to heal, not rest — so running is allowed, inside limits. DURING a run: pain up to 3/10 is acceptable; above 4/10, stop. NEXT MORNING is the real test — it must be no worse than before the run. Worse the next day, or worsening run after run, means the last run was too much: cut the next by a third. Three bad mornings in a row = stop and go back to the doctor.", c:"var(--rust)"},
            {t:"Exhausted ≠ tired",        a:"Tired legs feel heavy and warm up after 10 min — keep going. Exhausted legs feel dead and never improve — end the run there. Stopping is the training working, not you failing.", c:"var(--rust)"},
            {t:"Long runs: avg HR under 140", a:"Now you have the strap, this is the number that matters. An easy long run averages 130–140 bpm. Your 15 Aug 9.81km averaged 151 with a quarter of it above 163 — that was a race effort, not a long run, and your shins paid for it two days later. If you're sitting above 155, walk more and slow the run blocks. Going long and going hard are two different sessions; never do both.", c:"var(--amber)"},
            {t:"Nothing hard after a long run", a:"The long run IS the session. An hour of dancing, kickboxing or a gym leg day straight afterwards doubles the load on legs that are already at their limit — and that stacking is what turns tired shins into injured ones. Sunday is for walking, stretching and food.", c:"var(--amber)"},
            {t:"Don't chase the 42km badge", a:"🏅 Berlin 42km My Way is CUMULATIVE, not a single run, and your plan already wins it. From 10 Sep the schedule delivers 57km inside the 17-day window against the 37km you need — you cross 42km on Tue 22 Sep, five days early, with 20km to spare. You could miss two entire runs and still complete it. So add NOTHING to fill the bar: chasing a cumulative number is exactly the wrong incentive with inflamed tendons, and adding distance you were not scheduled to run is the specific habit that produced this injury.", c:"var(--sage)"},
            {t:"Swap the session, never skip it", a:"⚡ YOUR BIGGEST RISK IS NOT OVERTRAINING — it is the stop-start. Heat sickness, exams, a holiday, a fever and now the tendons have each cost you a block, and lost weeks have hurt this build far more than any single hard run. So a day you cannot RUN is not a day off: 45 min of spinning or easy cycling gives nearly the same aerobic stimulus with ZERO load on the tendon. Elliptical, swimming and aqua-jogging all count. Reserve total rest for fever or genuine bone pain. The fitness that carries you through 21.1km is built by never losing a week, not by any one heroic session.", c:"var(--sage)"},
            {t:"Balms don't heal — and they hide things", a:"Tiger Balm and Vicks are counterirritants: menthol and camphor create a warm or cool sensation in the SKIN. They feel good and they are harmless, but they do not meaningfully change blood flow deep in a tendon and they are not a treatment. The loading work is. ⚠️ THE REAL RISK IS MASKING: never apply one before a run, and never before you press-test your shins — you will get a falsely clean reading on the one signal that decides whether you should be running at all.", c:"var(--amber)"},
            {t:"Drift is the race, not pace", a:"📊 MEASURED TWICE, AND IT REPRODUCED. 12 Sep (regression over 32 intervals, separating pace from elapsed time): +2.6 bpm per 10 min at constant pace, with time on feet explaining ~78% of the rise between halves and pace only ~22%. 14 Sep was a cleaner read — run legs held to 155m ±6m for the whole session, so pace was near-constant by construction — and gave +3.0 bpm per 10 min. Call it ~3.\n\nAt that rate the first 90 minutes of the race cost you about +27 bpm before pace enters the picture at all. (Drift flattens in the back half rather than running up forever, so don't extrapolate a straight line to the finish — but the first half is real and it is enough.) THIS is why you start slower than feels right.\n\nAnd it is why DRINKING is a primary lever, not a comfort: falling plasma volume and rising core temperature are the engines of cardiac drift, and they are the part you can actually control mid-race. You lost 1,045ml on 12 Sep. Walk every water station, take something at each one, and carry fluid on anything over 8km.", c:"var(--amber)"},
            {t:"Your form ceiling is 5km", a:"⚕️ You have now reported this twice unprompted — 15 Aug and 8 Sep — and the data agrees: run legs get FASTER and HR climbs in the back third while your posture degrades. This is not aerobic fitness failing, it is the hip and postural muscles fatiguing, which is precisely what loads the tibialis tendons. TWO RESPONSES. (1) On any run past 5km, shorten the RUN leg — 60s becomes 45s. Less time loaded in a bad position, and it costs about 4 minutes across a whole half marathon. (2) Hips are the fix: clamshells and hip thrusts are not optional extras, they are the reason the collapse happens at 5km rather than 12km.", c:"var(--rust)"},
            {t:"Match your legs: 148m run, 150m walk", a:"⚡ THE FIX FOR THE PACE PROBLEM. Being told 6:45/km hasn't worked for three runs — you can't judge pace inside a 60-second burst. Use DISTANCE PER REP instead; your interval app reports it. A 60s run leg at 6:45/km covers 148m. A 90s walk leg at 10:00/km covers 150m. So the cue is: COVER ABOUT THE SAME DISTANCE RUNNING AS WALKING. On 8 Sep you ran 164m and walked 131m — running further than you walk is the signature of running too hard and strolling the recovery. Glance at a rep or two mid-run. Both versions finish 21.1km in ~2h57; only one of them averages HR 133 with a third of the session above 149.", c:"var(--rust)"},
            {t:"Watch the walk FLOOR, not the average", a:"⚕️ Your own number, from 8 Sep: the lowest HR you reach during a walk break. Over the first four sets it bottomed out near 104 bpm; over the last four it only fell to 123. That rise IS the session ending — the breaks have stopped clearing the load. RULE: once your walk floor stops dropping below ~120, you have a few sets left, not twenty. Finish the current block and walk home. Without a strap: if you can't speak a full sentence by the END of a walk break, same thing.", c:"var(--amber)"},
            {t:"Lower-calf pain: which SIDE decides everything", a:"⚕️ 19.09.26, three days after the B2Run: the whole-calf soreness faded and left ONE SPOT in the lower left calf, plus pain going up on the toes. That pattern is the race DOMS clearing and revealing what was underneath — so the location now carries real diagnostic weight.\n\n👉 INNER SIDE (facing the other leg) = POSTERIOR TIBIALIS, the diagnosed injury. Localised lower-medial pain PLUS pain on a heel raise is the textbook presentation, and pain on a single-leg heel raise is the standard clinical test for it. 👉 OUTER SIDE = peroneals, a different and much less significant problem.\n\n🏃 THIS DOES NOT AUTOMATICALLY STOP A RUN. Tendinopathy is one of the few things that WANTS load — the test is not 'no pain' but THE 24-HOUR RULE: up to about 3–4/10 during the run, settling within a day, is acceptable and even useful. Climbing during the run, or still there the next morning, means it was too much.\n\n⚡ HOW TO RUN ON IT: land midfoot, short quick steps, DO NOT PUSH OFF THE TOES — toe-off is the exact movement that hurts. Shuffle rather than stride. Flat ground only, no hills or stairs. Brisk FLAT-FOOTED walk breaks, not a toe-push.", c:"var(--rust)"},
            {t:"Speed moves the damage to your calves", a:"⚕️ THE B2RUN LESSON, 16 Sep. You ran 166m per run leg instead of 148m — about 6:00/km against a 6:45 target — and the next day it was CALVES AND ANKLES that hurt, not shins. That is not random. Running faster shifts you toward the forefoot and loads the calf-Achilles complex hard, while slower running loads the shin and tibialis more. Speed did not spread the load, it MOVED it onto tissue you have never trained.\n\nSo you now have two separate injuries to respect, and the calf is the acute one: pain to LIGHT TOUCH is not ordinary soreness — ordinary soreness hurts on contraction and deep pressure, not on a fingertip. Treat it as a mild strain until proven otherwise.\n\nTHE RULE: pace discipline is not about the clock, it is about WHICH TISSUE takes the load. 148m per run leg keeps you on the tissue you have spent five months conditioning.", c:"var(--rust)"},
            {t:"Boston 12: TESTED AND REJECTED", a:"👟 VERDICT IN — 14 Sep, 5km. Your words: 'like a brick beneath the legs', LEFT ANKLE HURTING BY THE END, right-side padding not matching the arch, 'faster but yet making me slow'. The left ankle is the injured side, and end-of-run onset is the tendinopathy signature. That is four flags on one run, and the rule was one. THEY ARE OUT for B2Run, for the 12km, and for 4 Oct — the Duramos do all three.\n\nWHY, so it doesn't feel like a wasted purchase: the Boston 12 is a firm dual-density midsole with stiff EnergyRods through the forefoot. That build is engineered to return energy when you land hard and fast. At 9:10/km average the foam barely compresses and the rods never load — so you get all the stiffness and none of the return. It genuinely is a brick AT YOUR PACES. It is a good shoe you are asking to do the wrong job. Keep them for tempo work at 5:30/km next year.", c:"var(--rust)"},
          ].map((r,i) => (
            <div key={i} style={{display:"flex", gap:14, alignItems:"flex-start"}}>
              <div className="data-num-tight" style={{
                fontSize:24, color:r.c, width:32, lineHeight:1, flexShrink:0
              }}>{String(i+1).padStart(2,"0")}</div>
              <div>
                <div style={{fontSize:14, color:"var(--paper)", fontWeight:600}}>{r.t}</div>
                <div style={{fontSize:12.5, color:"var(--paper-mute)", marginTop:2, lineHeight:1.5}}>{r.a}</div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function RunPlanTab({openWeek, setOpenWeek, done, toggleDone, runNotes, editingNote, setEditingNote, noteText, setNoteText, saveNote}){
  /* Actual km run per week, summed from Log Book entries. This tab is
     conditionally mounted, so switching back to it re-reads localStorage
     and picks up runs logged since. */
  const [ranKm, setRanKm] = useState({});
  useEffect(()=>{
    const saved = lsGet("logbook");
    if (!saved) return;
    try {
      const totals = {};
      JSON.parse(saved).forEach(e => {
        const wk = Number(e.week), d = parseFloat(e.distance);
        if (Number.isFinite(wk) && Number.isFinite(d)) totals[wk] = (totals[wk] || 0) + d;
      });
      setRanKm(totals);
    } catch {}
  },[]);

  return (
    <div className="fade-in" style={{padding:"22px 0 8px"}}>
      <SectionHead title="The plan" sub="Hybrid · Galloway base + strides + continuous + race-pace"/>
      <PhaseLegend/>

      {/* Methods explainer */}
      <details className="card grain grain-dark" style={{marginBottom:14, padding:"14px 16px", borderColor:"rgba(94,201,90,0.28)"}}>
        <summary style={{listStyle:"none", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"space-between", gap:12}}>
          <div>
            <div className="mono-cap" style={{color:"var(--sage)"}}>The six tools in this plan</div>
            <div style={{fontSize:12.5, color:"var(--paper-dim)", marginTop:4}}>Tap to learn what each session type does</div>
          </div>
          <span style={{color:"var(--paper-faint)", fontSize:11}}>▾</span>
        </summary>
        <div style={{marginTop:14, paddingTop:12, borderTop:"1px solid var(--line)", display:"flex", flexDirection:"column", gap:14}}>
          {[
            {n:"Galloway intervals", c:"#5EC95A", w:"Every run", d:"Run/walk pattern (e.g. 60s run / 90s walk). The chassis of the plan. Walk breaks keep impact low — your shins' best friend. You'll race with these too."},
            {n:"Breathing rhythm", c:"#B89AC7", w:"Every run", d:"Your chest pain is diaphragm spasm — a stitch. THREE PREVENTIONS: (1) Nothing to eat for 2–3h before you run. This is the single biggest cause, and it already gave you one stitch back in May. (2) Breathe into your BELLY, not your chest — a hand on your stomach should rise more than one on your ribs. (3) Don't always exhale on the same foot; that loads one side of the diaphragm every stride. Switch which foot you exhale on every few breaths. IN THE MOMENT: slow to a walk, big breath in, then a long forceful exhale through pursed lips. Nose-breathing works for you because it's the same thing — slower, deeper air."},
            {n:"Brisk walk breaks", c:"#FF5A35", w:"Every walk break", d:"⚡ THE CHEAPEST TIME IN THE PLAN. Your walk breaks have been 11:30–13:00/km — that's a stroll. A purposeful walk is 10:00/km: upright, arms driving, like you're late for a train. At 90s/60s over 21.1km, walking 10:00 instead of 11:30 is worth roughly 15 MINUTES off your finish time — for zero extra impact on your shins and zero extra effort from your legs. Nothing else in this plan gives you that much for that little. Time one break on every run: slower than 10:30/km means you're strolling.\n\n🔄 SECOND JOB — EVERY WALK BREAK IS A FORM RESET. Your shins hurt when your posture collapses past 5–6km, not from the distance itself. So use each break: stand tall, drop the shoulders, then start the next run block with quick light feet. On a long run that's 20+ chances to rebuild your form before it degrades. This is the real reason walk breaks protect your shins."},
            {n:"Cadence — NOT footstrike", c:"#F5A028", w:"Every run segment", d:"Cadence = how MANY steps per minute. Footstrike = which PART of the foot lands. They are independent — you can run 175 SPM heel-striking. Only cadence is worth changing. Target ~160 SPM first, then 165–175 over several weeks (your watch's run-average blends in walking, so it reads lower — check the per-interval breakdown for your true running number). ⛔ 175 is a ceiling, not a scoreboard: past ~180 at easy pace you're just taking tiny choppy steps, burning extra energy and tiring your calves for no gain. More is NOT better. The cue is SHORTER STEPS — that alone lands your foot under your hip instead of out in front, cutting the braking force that loads the shin. ⚠️ Do NOT deliberately land on your forefoot/toes. It doesn't reduce injury risk — it just moves load onto the Achilles, calf and metatarsals — and forcing it usually produces toe-reaching (foot pointed down but still landing out in front), which is the worst of both worlds. Land however you naturally land and forget about your feet."},
            {n:"Strides", c:"#B89AC7", w:"After Thu runs (wks 14–17)", d:"3–6 × 15s controlled-fast pickups on flat ground, full recovery between. Too short to stress shins; huge payoff for form and leg turnover. Doubles as your best cadence drill — turnover naturally goes quick here."},
            {n:"Continuous-run finisher", c:"#4DB8F5", w:"End of Sat long runs (wks 14–17)", d:"After the intervals, drop the walk breaks and run continuous Zone 2 for the last 2–3 min. Trains your body to keep moving without a break — and gives you a finish gear for the last stretch on race day."},
          ].map((m,i) => (
            <div key={i} style={{display:"flex", gap:14, alignItems:"flex-start"}}>
              <div style={{width:8, height:8, borderRadius:"50%", background:m.c, marginTop:6, flexShrink:0}}/>
              <div style={{flex:1, minWidth:0}}>
                <div style={{display:"flex", alignItems:"baseline", gap:8, flexWrap:"wrap"}}>
                  <span style={{fontSize:14, fontWeight:600, color:"var(--paper)"}}>{m.n}</span>
                  <span style={{fontSize:10.5, color:"var(--paper-faint)", letterSpacing:"0.04em"}}>{m.w}</span>
                </div>
                <div style={{fontSize:12.5, color:"var(--paper-dim)", marginTop:4, lineHeight:1.55}}>{m.d}</div>
              </div>
            </div>
          ))}
        </div>
      </details>

      <div style={{display:"flex", flexDirection:"column", gap:8}}>
        {WEEKS.map(w => {
          const pc = PHASE_COLOR[w.phase] || "#888";
          const isOpen = openWeek === w.w;
          const wStart = new Date(WEEK1_START);
          wStart.setDate(wStart.getDate() + (w.w-1)*7);
          const wEnd = new Date(wStart); wEnd.setDate(wStart.getDate()+7);
          const isCurrent = TODAY >= wStart && TODAY < wEnd;
          const wRuns = w.runs.filter(r => r.i !== "Rest" && !r.i.includes("RACE"));
          const wDone = wRuns.filter(r => done[`${w.w}-${r.d}`]).length;
          const weekKm = w.runs.filter(r => r.km && r.km !== "—")
            .map(r => parseFloat(r.km.replace("~","").replace("km","")) || 0)
            .reduce((a,b) => a+b, 0).toFixed(1);
          const allDone = wDone === wRuns.length && wRuns.length>0;
          const ran = ranKm[w.w] || 0;
          const delta = ran - parseFloat(weekKm);

          return (
            <div key={w.w} className="card grain grain-dark" style={{
              overflow:"hidden",
              borderColor: isCurrent ? "var(--line-warm)" : "var(--line)",
              boxShadow: isCurrent ? "0 12px 32px -18px rgba(229,152,73,0.4), 0 1px 0 rgba(0,0,0,0.4)" : "var(--shadow-warm)"
            }}>
              <button onClick={()=>setOpenWeek(isOpen ? null : w.w)} style={{
                width:"100%", background:"transparent", border:"none",
                padding:"14px 16px", textAlign:"left",
                display:"flex", alignItems:"center", gap:14
              }}>
                <div style={{flexShrink:0, position:"relative"}}>
                  <div className="data-num-tight" style={{
                    fontSize:28, color: isCurrent ? "var(--amber)" : "var(--paper)", lineHeight:1
                  }}>{String(w.w).padStart(2,"0")}</div>
                  <div className="mono-cap" style={{color:"var(--paper-faint)", marginTop:2}}>wk</div>
                </div>
                <div style={{width:1, alignSelf:"stretch", background:"var(--line)"}}/>
                <div style={{flex:1, minWidth:0}}>
                  <div style={{display:"flex", alignItems:"center", gap:8, flexWrap:"wrap"}}>
                    <span style={{fontSize:15, fontWeight:600, color:"var(--paper)"}}>{w.phase}</span>
                    {w.deload && <span className="chip" style={{color:"#D2B58C", borderColor:"rgba(210,181,140,0.3)"}}>DELOAD</span>}
                    {w.tuneup && <span className="chip chip-rust">{w.tuneup}</span>}
                    {isCurrent && <span className="chip chip-amber"><span className="live" style={{display:"inline-block",width:0}}/>NOW</span>}
                    {allDone && <span className="chip chip-sage">✓ done</span>}
                  </div>
                  <div style={{
                    fontSize:11.5, color: isCurrent ? "var(--amber)" : "var(--paper-faint)",
                    marginTop:4, fontVariantNumeric:"tabular-nums",
                    fontFamily:"'Space Grotesk', sans-serif", letterSpacing:"-0.005em"
                  }}>
                    {weekRange(w.w)}
                  </div>
                  <div style={{
                    fontSize:11.5, color:"var(--paper-dim)", marginTop:3,
                    fontVariantNumeric:"tabular-nums"
                  }}>
                    <span style={{color:pc}}>●</span> &nbsp;{wDone}/{wRuns.length} runs · {weekKm} km · {w.shoe}
                  </div>
                  {ran > 0 && (
                    <div style={{
                      fontSize:11.5, marginTop:3, color:"var(--sage)",
                      fontVariantNumeric:"tabular-nums",
                      fontFamily:"'Space Grotesk', sans-serif"
                    }}>
                      ▲ &nbsp;{ran.toFixed(1)} km actually run
                      <span style={{color: Math.abs(delta) < 0.05 ? "var(--paper-faint)" : (delta > 0 ? "var(--amber)" : "var(--paper-dim)")}}>
                        {Math.abs(delta) < 0.05 ? "  · on plan" : `  · ${delta > 0 ? "+" : "−"}${Math.abs(delta).toFixed(1)} vs plan`}
                      </span>
                    </div>
                  )}
                </div>
                <div style={{color:"var(--paper-faint)"}}><Chev open={isOpen}/></div>
              </button>

              {isOpen && (
                <div className="fade-in" style={{
                  borderTop:"1px solid var(--line)",
                  padding:"6px 12px 12px",
                  background:"rgba(0,0,0,0.18)"
                }}>
                  {w.runs.map((run,i) => (
                    <RunRow key={i} run={run} w={w}
                      isDone={!!done[`${w.w}-${run.d}`]}
                      toggle={()=>toggleDone(`${w.w}-${run.d}`)}
                      note={runNotes[`${w.w}-${run.d}`]}
                      isEditing={editingNote === `${w.w}-${run.d}`}
                      onEdit={()=>{ setEditingNote(`${w.w}-${run.d}`); setNoteText(runNotes[`${w.w}-${run.d}`] || ""); }}
                      onCancel={()=>setEditingNote(null)}
                      onSave={()=>saveNote(`${w.w}-${run.d}`)}
                      noteText={noteText}
                      setNoteText={setNoteText}
                    />
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function RunRow({run, w, isDone, toggle, note, isEditing, onEdit, onCancel, onSave, noteText, setNoteText}){
  const isRest = run.i === "Rest";
  const isRace = run.i.includes("RACE");
  const rd = runDate(w.w, run.d);
  const todayRun = isToday(rd);
  const pastRun = isPast(rd);
  const km = run.km && run.km !== "—" ? run.km.replace("~","") : null;
  const watch = watchCfg(run.i, run.t);

  let statusTag = null;
  if (isRace) statusTag = <span className="chip chip-rust">RACE</span>;
  else if (todayRun && !isDone) statusTag = <span className="chip chip-amber">TODAY</span>;
  else if (isDone) statusTag = <span className="chip chip-sage">DONE</span>;
  else if (pastRun && !isRest) statusTag = <span className="chip" style={{color:"#E89484"}}>MISSED?</span>;

  return (
    <div style={{
      padding:"12px 6px 12px 6px",
      borderBottom:"1px dashed var(--line)",
      display:"flex", gap:14, alignItems:"flex-start",
      opacity: isRest ? 0.55 : 1,
      position:"relative"
    }}>
      {!isRest && !isRace ? (
        <button className={`runcheck ${isDone ? "is-done" : ""}`}
          onClick={toggle}
          aria-label={isDone ? "Mark not done" : "Mark done"}
        >
          <svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>
        </button>
      ) : (
        <div style={{
          width:28, height:28, flexShrink:0,
          display:"grid", placeItems:"center",
          color: isRace ? "var(--amber)" : "var(--paper-faint)"
        }}>
          {isRace
            ? <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M5 21V4M5 4h12l-2 4 2 4H5"/></svg>
            : <span style={{fontSize:10, letterSpacing:2, fontWeight:600}}>REST</span>
          }
        </div>
      )}

      <div style={{flex:1, minWidth:0}}>
        <div style={{display:"flex", alignItems:"center", gap:8, flexWrap:"wrap"}}>
          <span style={{
            fontSize:11.5, fontWeight:700, letterSpacing:"0.1em",
            color: todayRun ? "var(--amber)" : isDone ? "var(--sage)" : "var(--paper-dim)"
          }}>{run.d.toUpperCase()}</span>
          <span style={{fontSize:11, color:"var(--paper-faint)", fontVariantNumeric:"tabular-nums"}}>
            {fmt(rd)}
          </span>
          {km && <span className="chip" style={{
            color: todayRun ? "var(--amber)" : "var(--paper-mute)",
            borderColor: todayRun ? "rgba(229,152,73,0.3)" : "var(--line)"
          }}>{km}</span>}
          {run.t !== "—" && (
            <span style={{
              marginLeft:"auto",
              fontSize:11, color:"var(--paper-faint)",
              fontVariantNumeric:"tabular-nums"
            }}>{run.t}</span>
          )}
        </div>
        {watch && (
          <div style={{display:"flex", alignItems:"center", gap:5, marginTop:3}}>
            <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{color:"var(--paper-faint)", flexShrink:0}}>
              <circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 1h6M18.5 6.5l1.5-1.5"/>
            </svg>
            <span style={{fontSize:11, color:"var(--paper-faint)", fontFamily:"'Space Grotesk',sans-serif", letterSpacing:"0.01em"}}>
              {watch.approx ? "~" : ""}{watch.sets} sets · {watch.run} run / {watch.walk} walk{watch.approx ? " · then open run" : ""}
            </span>
          </div>
        )}
        <div style={{
          fontSize: isRace ? 18 : 14.5,
          fontFamily: isRace ? "'DM Serif Display', serif" : "inherit",
          fontStyle: isRace ? "italic" : "normal",
          fontWeight: isRace ? 400 : 600,
          color: isRace ? "var(--amber-hot)" : isDone ? "var(--paper)" : "var(--paper)",
          marginTop:5,
          textDecoration: isDone ? "none" : "none"
        }}>{run.i}</div>
        <div style={{display:"flex", alignItems:"center", gap:8, marginTop:5, flexWrap:"wrap"}}>
          {statusTag}
          {!isRest && (
            <span style={{fontSize:10.5, color:"var(--sage)", fontWeight:500, letterSpacing:"0.04em"}}>
              Zone 2 · 115–140 bpm
            </span>
          )}
        </div>
        {run.n && (
          <div style={{
            fontSize:12, color:"var(--paper-dim)", marginTop:7,
            fontStyle:"italic", lineHeight:1.5, fontFamily:"'DM Serif Display', serif",
            fontWeight:400, fontSize:13.5
          }}>{run.n}</div>
        )}

        {isDone && (
          <div style={{marginTop:10, paddingTop:10, borderTop:"1px solid var(--line)"}}>
            {isEditing ? (
              <div>
                <textarea className="note" value={noteText} onChange={e=>setNoteText(e.target.value)}
                  placeholder="How did it go? Shins? HR? Pace?"
                  autoFocus
                />
                <div style={{display:"flex", gap:6, marginTop:8, justifyContent:"flex-end"}}>
                  <button className="btn btn-ghost" onClick={onCancel}>Cancel</button>
                  <button className="btn btn-amber" onClick={onSave}>Save note</button>
                </div>
              </div>
            ) : (
              <button onClick={onEdit} style={{
                background:"transparent", border:"none",
                display:"flex", alignItems:"center", gap:8,
                padding:0, color:"var(--paper-dim)",
                fontSize:12, textAlign:"left", width:"100%"
              }}>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0, color:"var(--amber)"}}>
                  <path d="M12 20h9M16.5 3.5a2.1 2.1 0 113 3L7 19l-4 1 1-4z"/>
                </svg>
                <span style={{
                  fontStyle: note ? "italic" : "normal",
                  fontFamily: note ? "'DM Serif Display',serif" : "inherit",
                  fontSize: note ? 14 : 12,
                  color: note ? "var(--paper-mute)" : "var(--paper-faint)",
                  lineHeight:1.5
                }}>
                  {note || "Add a note about this run…"}
                </span>
              </button>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

  return (
    <div className="card grain grain-dark" style={{
      marginTop:14, overflow:"hidden",
      borderColor:"rgba(77,184,245,0.38)"
    }}>

          <div style={{
            width:36, height:36, borderRadius:10, flexShrink:0,
            background:"rgba(77,184,245,0.12)", border:"1px solid rgba(77,184,245,0.35)",
            display:"grid", placeItems:"center", color:"#4DB8F5"
          }}><WatchIco/></div>
          <div>
            <div className="mono-cap" style={{color:"#4DB8F5"}}>Apple Watch · Race Setup</div>
            <div style={{fontSize:12, color:"var(--paper-dim)", marginTop:2}}>4 sections · tap to expand</div>
          </div>
        </div>
      </div>

      <div style={{borderTop:"1px solid var(--line)"}}>
        {sections.map((s,si) => {
          const isOpen = open === si;
          return (
            <div key={si} style={{borderBottom: si < sections.length-1 ? "1px solid var(--line)" : "none"}}>
              <button onClick={()=>setOpen(isOpen?null:si)} style={{
                width:"100%", background:"transparent", border:"none",
                padding:"13px 18px", textAlign:"left",
                display:"flex", alignItems:"center", gap:12
              }}>
                <div style={{width:8, height:8, borderRadius:"50%", background:s.color, flexShrink:0, boxShadow:`0 0 8px ${s.color}`}}/>
                <span style={{flex:1, fontSize:13.5, fontWeight:600, color:"var(--paper)"}}>{s.label}</span>
                <Chev open={isOpen}/>
              </button>
              {isOpen && (
                <div className="fade-in" style={{padding:"4px 18px 16px", background:"rgba(0,0,0,0.18)"}}>
                  {s.steps.map((step,i) => (
                    <div key={i} style={{
                      display:"flex", gap:14, alignItems:"flex-start",
                      padding:"10px 0",
                      borderBottom: i < s.steps.length-1 ? "1px dashed var(--line)" : "none"
                    }}>
                      <div className="data-num-tight" style={{
                        fontSize:13, color:s.color, flexShrink:0, width:20,
                        paddingTop:2, opacity:0.9
                      }}>{String(i+1).padStart(2,"0")}</div>
                      <div>
                        <div style={{fontSize:13.5, fontWeight:600, color:"var(--paper)", lineHeight:1.3}}>{step.t}</div>
                        <div style={{fontSize:12.5, color:"var(--paper-mute)", marginTop:4, lineHeight:1.6}}>{step.d}</div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}
