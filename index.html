function LogBookTab(){
  const [entries, setEntries] = useState([]);
  const [editingId, setEditingId] = useState(null);
  const [editShins, setEditShins] = useState("");
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({...EMPTY_FORM, date: TODAY.toISOString().slice(0,10)});

  useEffect(()=>{
    let existing = [];
    const saved = lsGet("logbook");
    if (saved) try { existing = JSON.parse(saved); } catch {}

    /* One-time backfill of historical runs. Each batch is guarded by its own
       flag so it never runs twice, and deduped by date so it won't clobber
       manual entries. Add a new batch by appending to SEED_BATCHES. */
    let current = existing;
    for (const [flag, batch] of SEED_BATCHES) {
      if (lsGet(flag) === "true") continue;
      const haveDates = new Set(current.map(e=>e.date));
      const seeded = batch
        .filter(r => !haveDates.has(r.date))
        .map(r => ({ id: new Date(r.date).getTime(), ...r }));
      current = [...current, ...seeded];
      lsSet(flag, "true");
    }
    /* Apply patches after seeding so a batch added this session is patchable too. */
    for (const [flag, patch] of SEED_PATCHES) {
      if (lsGet(flag) === "true") continue;
      if (current.some(e => patch[e.date])) {
        current = current.map(e => patch[e.date] ? { ...e, ...patch[e.date] } : e);
      }
      lsSet(flag, "true");
    }
    if (current !== existing) lsSet("logbook", JSON.stringify(current));
    setEntries(current);
  },[]);

  const saveEntry = () => {
    if (!form.date) return;
    const weekNum = (() => {
      const d = new Date(form.date); d.setHours(0,0,0,0);
      for (const w of WEEKS) {
        const s = new Date(WEEK1_START); s.setDate(s.getDate()+(w.w-1)*7);
        const e = new Date(s); e.setDate(s.getDate()+7);
        if (d>=s && d<e) return w.w;
      }
      return 1;
    })();
    const entry = { id: Date.now(), week: weekNum, ...form };
    const next = [...entries, entry];
    setEntries(next);
    lsSet("logbook", JSON.stringify(next));
    setShowForm(false);
    setForm({...EMPTY_FORM, date: TODAY.toISOString().slice(0,10)});
  };

  const deleteEntry = id => {
    const next = entries.filter(e=>e.id!==id);
    setEntries(next);
    lsSet("logbook", JSON.stringify(next));
  };

  const saveShins = id => {
    const next = entries.map(e=>e.id===id?{...e, shins:editShins}:e);
    setEntries(next);
    lsSet("logbook", JSON.stringify(next));
    setEditingId(null);
  };

  const sorted = [...entries].sort((a,b)=>b.id-a.id);
  const totalKm = entries.reduce((s,e)=>s+(parseFloat(e.distance)||0),0).toFixed(1);

  return (
    <div className="fade-in" style={{padding:"22px 0 30px"}}>
      <div style={{display:"flex", alignItems:"flex-end", justifyContent:"space-between", marginBottom:4}}>
        <div>
          <h2 className="serif" style={{fontSize:"clamp(26px,6vw,34px)", color:"var(--bone)", lineHeight:1.05}}>Log Book</h2>
          <div style={{fontSize:12, color:"var(--paper-dim)", marginTop:4}}>
            {entries.length} run{entries.length!==1?"s":""} · {totalKm} km total
          </div>
        </div>
        <button onClick={()=>setShowForm(v=>!v)} className="btn btn-amber" style={{fontSize:12, padding:"8px 14px"}}>
          {showForm ? "Cancel" : "+ Add run"}
        </button>
      </div>

      {showForm && (
        <div className="card grain grain-dark fade-in" style={{marginTop:14, padding:"16px 16px 14px", borderColor:"rgba(94,201,90,0.3)"}}>
          <div className="mono-cap" style={{color:"var(--sage)", marginBottom:14}}>Manual log entry</div>
          <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:10}}>
            {[
              {k:"date",     l:"Date",     type:"date",   ph:""},
              {k:"distance", l:"Distance", type:"text",   ph:"e.g. 3.08"},
              {k:"pace",     l:"Pace /km", type:"text",   ph:"e.g. 7:15"},
              {k:"hr",       l:"Avg HR",   type:"number", ph:"e.g. 113"},
              {k:"duration", l:"Duration", type:"text",   ph:"e.g. 41:56"},
              {k:"cal",      l:"kcal",     type:"number", ph:"e.g. 224"},
            ].map(({k,l,type,ph})=>(
              <div key={k}>
                <div style={{fontSize:10.5, color:"var(--paper-faint)", marginBottom:4, letterSpacing:"0.06em", textTransform:"uppercase", fontFamily:"'Space Grotesk',sans-serif"}}>{l}</div>
                <input type={type} value={form[k]} onChange={e=>setForm(f=>({...f,[k]:e.target.value}))}
                  placeholder={ph}
                  style={{width:"100%", boxSizing:"border-box", background:"rgba(247,240,220,0.05)", border:"1px solid var(--line)",
                    borderRadius:8, color:"var(--paper)", fontSize:13, padding:"7px 10px",
                    fontFamily:"'Space Grotesk',sans-serif", outline:"none"}}/>
              </div>
            ))}
          </div>
          <div style={{marginTop:10}}>
            <div style={{fontSize:10.5, color:"var(--paper-faint)", marginBottom:4, letterSpacing:"0.06em", textTransform:"uppercase", fontFamily:"'Space Grotesk',sans-serif"}}>Effort</div>
            <div style={{display:"flex", gap:6}}>
              {["Easy","Moderate","Hard"].map(e=>(
                <button key={e} onClick={()=>setForm(f=>({...f,effort:e}))} style={{
                  flex:1, padding:"7px 0", borderRadius:8, fontSize:12, fontWeight:600, cursor:"pointer",
                  fontFamily:"'Space Grotesk',sans-serif",
                  background: form.effort===e ? "rgba(94,201,90,0.18)" : "rgba(247,240,220,0.04)",
                  border: form.effort===e ? "1px solid rgba(94,201,90,0.45)" : "1px solid var(--line)",
                  color: form.effort===e ? "var(--sage)" : "var(--paper-faint)"
                }}>{e}</button>
              ))}
            </div>
          </div>
          {[
            {k:"sessionName", l:"Session (e.g. 30s/120s)"},
            {k:"note",        l:"Note"},
            {k:"shins",       l:"Shins"},
          ].map(({k,l})=>(
            <div key={k} style={{marginTop:10}}>
              <div style={{fontSize:10.5, color:"var(--paper-faint)", marginBottom:4, letterSpacing:"0.06em", textTransform:"uppercase", fontFamily:"'Space Grotesk',sans-serif"}}>{l}</div>
              <input value={form[k]} onChange={e=>setForm(f=>({...f,[k]:e.target.value}))}
                placeholder=""
                style={{width:"100%", boxSizing:"border-box", background:"rgba(247,240,220,0.05)", border:"1px solid var(--line)",
                  borderRadius:8, color:"var(--paper)", fontSize:13, padding:"7px 10px",
                  fontFamily:"'Space Grotesk',sans-serif", outline:"none"}}/>
            </div>
          ))}
          <button onClick={saveEntry} className="btn btn-amber" style={{width:"100%", marginTop:14, padding:"10px", fontSize:13}}>
            Save to Log Book
          </button>
        </div>
      )}

      {entries.length === 0 ? (
        <div className="card grain grain-dark fade-in" style={{padding:"22px 18px", marginTop:18, borderColor:"rgba(94,201,90,0.28)", textAlign:"center"}}>
          <div style={{fontSize:28, marginBottom:12}}>📓</div>
          <div className="mono-cap" style={{color:"var(--sage)", marginBottom:8}}>No runs logged yet</div>
          <div style={{fontSize:13.5, color:"var(--paper-dim)", lineHeight:1.65}}>
            After each run, share your Apple Watch screenshots in the <strong style={{color:"var(--paper)"}}>Coach</strong> tab. A "Save to Log Book" button will appear — tap it to record your stats here.
          </div>
        </div>
      ) : (
        <div style={{display:"flex", flexDirection:"column", gap:12, marginTop:18}}>
          {sorted.map(e=>{
            const pc = PHASE_COLOR[WEEKS.find(w=>w.w===e.week)?.phase] || "var(--amber)";
            const isEditing = editingId === e.id;
            return (
              <div key={e.id} className="card grain grain-dark" style={{padding:"16px 16px 14px", borderLeft:`3px solid ${pc}`, borderRadius:"0 12px 12px 0"}}>
                {/* Header row */}
                <div style={{display:"flex", alignItems:"flex-start", justifyContent:"space-between", marginBottom:10}}>
                  <div>
                    <div style={{display:"flex", alignItems:"center", gap:8, flexWrap:"wrap"}}>
                      <span style={{fontSize:15, fontWeight:700, color:"var(--paper)", fontVariantNumeric:"tabular-nums"}}>
                        {new Date(e.date).toLocaleDateString("en-GB",{weekday:"short", day:"numeric", month:"short"})}
                      </span>
                      <span className="chip" style={{color:pc, borderColor:`${pc}44`}}>Wk {e.week}</span>
                      {e.effort && <span className="chip" style={{
                        color: e.effort==="Easy"?"var(--sage)":e.effort==="Moderate"?"var(--amber)":"var(--rust)",
                        borderColor: e.effort==="Easy"?"rgba(94,201,90,0.3)":e.effort==="Moderate"?"rgba(245,160,40,0.3)":"rgba(255,90,53,0.3)"
                      }}>{e.effort}</span>}
                    </div>
                    {e.sessionName && <div style={{fontSize:12, color:"var(--paper-faint)", marginTop:4, fontFamily:"'Space Grotesk',sans-serif"}}>{e.sessionName}</div>}
                  </div>
                  <button onClick={()=>deleteEntry(e.id)} style={{
                    background:"none", border:"none", color:"var(--paper-faint)", fontSize:14,
                    cursor:"pointer", padding:"2px 4px", lineHeight:1, opacity:0.5
                  }}>✕</button>
                </div>

                {/* Stats row */}
                <div style={{display:"flex", gap:8, flexWrap:"wrap", marginBottom:10}}>
                  {e.distance && (
                    <div style={{textAlign:"center", minWidth:52}}>
                      <div className="data-num-tight" style={{fontSize:20, color:"var(--paper)", letterSpacing:"-0.03em"}}>{e.distance}</div>
                      <div className="mono-cap" style={{fontSize:9, color:"var(--paper-faint)", marginTop:1}}>km</div>
                    </div>
                  )}
                  {e.distance && e.pace && <div style={{width:1, background:"var(--line)", alignSelf:"stretch"}}/>}
                  {e.pace && (
                    <div style={{textAlign:"center", minWidth:52}}>
                      <div className="data-num-tight" style={{fontSize:20, color:"var(--paper)", letterSpacing:"-0.03em"}}>{e.pace}</div>
                      <div className="mono-cap" style={{fontSize:9, color:"var(--paper-faint)", marginTop:1}}>/km</div>
                    </div>
                  )}
                  {e.pace && e.hr && <div style={{width:1, background:"var(--line)", alignSelf:"stretch"}}/>}
                  {e.hr && (
                    <div style={{textAlign:"center", minWidth:52}}>
                      <div className="data-num-tight" style={{fontSize:20, color: e.hr>140?"var(--amber)":"var(--sage)", letterSpacing:"-0.03em"}}>{e.hr}</div>
                      <div className="mono-cap" style={{fontSize:9, color:"var(--paper-faint)", marginTop:1}}>bpm</div>
                    </div>
                  )}
                  {e.hr && e.duration && <div style={{width:1, background:"var(--line)", alignSelf:"stretch"}}/>}
                  {e.duration && (
                    <div style={{textAlign:"center", minWidth:52}}>
                      <div className="data-num-tight" style={{fontSize:20, color:"var(--paper)", letterSpacing:"-0.03em"}}>{e.duration}</div>
                      <div className="mono-cap" style={{fontSize:9, color:"var(--paper-faint)", marginTop:1}}>time</div>
                    </div>
                  )}
                  {e.cal && (
                    <div style={{textAlign:"center", minWidth:44}}>
                      <div className="data-num-tight" style={{fontSize:20, color:"var(--paper-dim)", letterSpacing:"-0.03em"}}>{e.cal}</div>
                      <div className="mono-cap" style={{fontSize:9, color:"var(--paper-faint)", marginTop:1}}>kcal</div>
                    </div>
                  )}
                </div>

                {/* Coach note */}
                {e.note && (
                  <div className="serif-i" style={{
                    fontSize:13.5, color:"var(--paper-mute)", lineHeight:1.65,
                    borderTop:"1px solid var(--line)", paddingTop:10, marginBottom:10
                  }}>"{e.note}"</div>
                )}

                {/* Shins note */}
                {!isEditing ? (
                  <div style={{display:"flex", alignItems:"center", gap:8}}>
                    <span style={{fontSize:11.5, color: e.shins ? "var(--paper-dim)" : "var(--paper-faint)", fontStyle: e.shins ? "normal" : "italic"}}>
                      {e.shins || "Shins: tap to note"}
                    </span>
                    <button onClick={()=>{ setEditingId(e.id); setEditShins(e.shins||""); }} style={{
                      background:"none", border:"1px solid var(--line)", borderRadius:6,
                      color:"var(--paper-faint)", fontSize:10.5, padding:"2px 8px", cursor:"pointer",
                      fontFamily:"'Space Grotesk',sans-serif"
                    }}>edit</button>
                  </div>
                ) : (
                  <div style={{display:"flex", gap:6, alignItems:"center"}}>
                    <input
                      value={editShins}
                      onChange={e=>setEditShins(e.target.value)}
                      placeholder="e.g. Left shin fine, mild ache right"
                      autoFocus
                      style={{
                        flex:1, background:"rgba(247,240,220,0.05)", border:"1px solid var(--line-warm)",
                        borderRadius:8, color:"var(--paper)", fontSize:12.5,
                        padding:"7px 10px", fontFamily:"'Space Grotesk',sans-serif", outline:"none"
                      }}
                    />
                    <button onClick={()=>saveShins(e.id)} className="btn btn-amber" style={{fontSize:11, padding:"6px 12px"}}>Save</button>
                    <button onClick={()=>setEditingId(null)} className="btn btn-ghost" style={{fontSize:11}}>✕</button>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ───────── COACH TAB ───────── */
function CoachTab(){
  const [messages, setMessages]       = useState([]);
  const [pendingImages, setPendingImages] = useState([]);
  const [inputText, setInputText]     = useState("");
  const [loading, setLoading]         = useState(false);
  const bottomRef = useRef(null);
  const fileRef   = useRef(null);

  const currentWeek = useMemo(()=>{
    for(const w of WEEKS){
      const s=new Date(WEEK1_START); s.setDate(s.getDate()+(w.w-1)*7);
      const e=new Date(s); e.setDate(s.getDate()+7);
      if(TODAY>=s && TODAY<e) return w.w;
    }
    return TODAY<WEEK1_START?1:19;
  },[]);

  /* load saved chat on mount */
  useEffect(()=>{
    const saved = lsGet("coach_msgs");
    if (saved) try { setMessages(JSON.parse(saved)); } catch {}
  }, []);

  /* persist chat on every change — strip base64 to stay under localStorage limit */
  useEffect(()=>{
    if (messages.length === 0) return;
    const stripped = messages.map(m=>({
      ...m,
      images: [],
      hasImages: (m.images||[]).length > 0
    }));
    lsSet("coach_msgs", JSON.stringify(stripped.slice(-60)));
  }, [messages]);

  useEffect(()=>{
    bottomRef.current?.scrollIntoView({behavior:"smooth"});
  },[messages, loading]);

  const addImages = files => {
    Array.from(files).forEach(file=>{
      if(!file.type.startsWith("image/")) return;
      const reader = new FileReader();
      reader.onload = e => {
        const url = e.target.result;
        setPendingImages(prev=>[...prev,{base64:url.split(",")[1], mimeType:file.type, preview:url}]);
      };
      reader.readAsDataURL(file);
    });
  };

  const send = async()=>{
    if(!inputText.trim() && pendingImages.length===0) return;
    const userMsg = {role:"user", text:inputText.trim(), images:[...pendingImages]};
    const next = [...messages, userMsg];
    setMessages(next);
    setInputText(""); setPendingImages([]); setLoading(true);

    const system = `You are a warm, direct running coach for a complete beginner training for the Berlin Half Marathon, Sunday October 4 2026. Currently week ${currentWeek}/19.

Tune-up race: 5K on Sunday June 14 2026, 04:30 AM start (week 3 Sunday).

Plan is a hybrid: Galloway run/walk intervals as the base/chassis, plus three layered tools — strides (4–6 × 15s pickups after Thursday runs), continuous-run finishers (drop walk breaks for the final X minutes of Saturday long runs, building 5→20 min through the plan), and race-pace intervals on Tuesdays in weeks 10–17. Race-day intervals will be 60s run / 30s walk; goal pace 7:05/km for 2h30, stretch 6:25/km for 2h15.

Athlete background: occasional cardio 2-3x/month, shin splint risk (highest priority to protect), cross-trains with spinning (Fri Beat81), gym (Mon), yoga/Bollywood/Hyrox (Sun), German class (Wed). Wears Apple Watch, based in Berlin.

Athlete's stated priorities, in order: stay healthy, enjoy the process, learn something new this year, finish the half marathon standing tall. Time goals are secondary to those.

When they share screenshots: carefully read every metric visible, describe what you see, then ask one follow-up about how the session felt.
When they describe feelings: give specific, honest feedback referencing their actual numbers. If the data looks concerning (HR too high, HRV dropping, poor sleep), flag it directly.
If the plan needs adjusting: suggest a concrete change (e.g. "skip strides this Thursday, save the legs"). Don't push them toward 2h15 if their body is telling them otherwise.
Style: coach texting a friend — short paragraphs, warm but direct, never generic.

IMPORTANT — Log Book integration: When the user shares a workout screenshot and you can read the metrics, append this block EXACTLY at the very end of your response with no text after it:
<log>{"distance":"X.XX","pace":"M:SS","hr":NNN,"duration":"H:MM:SS","cal":NNN,"effort":"Easy","sessionName":"interval format e.g. 30s/120s","note":"One coaching sentence max 12 words"}</log>
Only include fields visible in the screenshots. Omit any field you cannot read. If no workout data is visible, omit the block entirely.`;

    const contents = next.slice(-12).map(msg=>({
      role: msg.role==="ai"?"model":"user",
      parts:[
        ...(msg.images||[]).map(img=>({inlineData:{mimeType:img.mimeType, data:img.base64}})),
        ...(msg.text?[{text:msg.text}]:[])
      ].filter(p=>p.text!==undefined||p.inlineData)
    }));

    try{
      const res = await fetch(
        `https://marathon-coach.onrender.com/coach`,
        {method:"POST", headers:{"Content-Type":"application/json"},
          body:JSON.stringify({
            systemInstruction:{parts:[{text:system}]},
            contents,
            generationConfig:{temperature:0.75, maxOutputTokens:650}
          })
        }
      );
      const data = await res.json();
      if (!res.ok || data.error) {
        const msg = data.error?.message || `HTTP ${res.status}`;
        setMessages(prev=>[...prev,{role:"ai", text:`API error: ${msg}`}]);
        return;
      }
      const cand = data.candidates?.[0];
      const rawText = cand?.content?.parts?.map(p=>p.text).filter(Boolean).join("\n");
      if (rawText) {
        const logMatch = rawText.match(/<log>([\s\S]*?)<\/log>/);
        let logData = null;
        let text = rawText;
        if (logMatch) {
          text = rawText.replace(/<log>[\s\S]*?<\/log>/, "").trim();
          try { logData = JSON.parse(logMatch[1]); } catch {}
        }
        setMessages(prev=>[...prev,{role:"ai", text, logData, logSaved:false}]);
      } else if (cand?.finishReason && cand.finishReason !== "STOP") {
        setMessages(prev=>[...prev,{role:"ai", text:`Response blocked (${cand.finishReason}). Try rephrasing or a different screenshot.`}]);
      } else {
        setMessages(prev=>[...prev,{role:"ai", text:"Empty response from model. Try again?"}]);
      }
    }catch(e){
      setMessages(prev=>[...prev,{role:"ai", text:`Connection issue: ${e.message}`}]);
    }finally{ setLoading(false); }
  };

  const handleKey = e=>{ if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();} };
  const canSend = !loading && (inputText.trim().length>0 || pendingImages.length>0);

  const saveToLog = (msgIdx, logData) => {
    const entry = {
      id: Date.now(),
      date: TODAY.toISOString().slice(0,10),
      week: currentWeek,
      shins: "",
      ...logData
    };
    const existing = JSON.parse(lsGet("logbook") || "[]");
    existing.push(entry);
    lsSet("logbook", JSON.stringify(existing));
    setMessages(prev => prev.map((m,i) => i===msgIdx ? {...m, logSaved:true} : m));
  };

  const AiAvatar = ()=>(
    <div style={{
      width:28,height:28,borderRadius:"50%",flexShrink:0,
      background:"rgba(94,201,90,0.14)",border:"1px solid rgba(94,201,90,0.38)",
      display:"grid",placeItems:"center",color:"var(--sage)",marginBottom:2
    }}>
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
      </svg>
    </div>
  );

  return (
    <div className="fade-in" style={{paddingTop:22, paddingBottom:30}}>
      {/* Header */}
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-end", marginBottom:18}}>
        <div>
          <h2 className="serif" style={{fontSize:"clamp(26px,6vw,34px)", color:"var(--bone)", lineHeight:1.05}}>AI Coach</h2>
          <div style={{fontSize:12, color:"var(--paper-dim)", marginTop:4}}>Gemini Flash · Week {currentWeek} of 19</div>
        </div>
        {messages.length>0 && (
          <button onClick={()=>{ setMessages([]); lsSet("coach_msgs","[]"); }} className="btn btn-ghost" style={{fontSize:11, color:"var(--paper-faint)"}}>
            Clear
          </button>
        )}
      </div>

      {/* Empty state */}
      {messages.length===0 && (
        <div className="card grain grain-dark fade-in" style={{padding:"18px 18px 16px", marginBottom:18, borderColor:"rgba(94,201,90,0.35)"}}>
          <div className="mono-cap" style={{color:"var(--sage)", marginBottom:10}}>How to use</div>
          <div className="serif-i" style={{fontSize:15, color:"var(--paper-mute)", lineHeight:1.75, marginBottom:12}}>
            "Share an Apple Watch screenshot after your run and I'll read your stats, ask how it felt, and flag anything we should change in the plan."
          </div>
          <div style={{display:"flex", flexDirection:"column", gap:8}}>
            {[
              "Tap 📷 → pick your Workout or Heart Rate screenshot",
              "Or type how your run felt — shins, HR, energy",
              "I'll ask follow-up questions and suggest plan tweaks",
            ].map((t,i)=>(
              <div key={i} style={{display:"flex", gap:10, alignItems:"flex-start"}}>
                <div className="data-num-tight" style={{fontSize:13, color:"var(--sage)", flexShrink:0, opacity:0.7}}>{String(i+1).padStart(2,"0")}</div>
                <div style={{fontSize:13, color:"var(--paper-dim)", lineHeight:1.5}}>{t}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Messages */}
      <div style={{display:"flex", flexDirection:"column", gap:12, marginBottom:16}}>
        {messages.map((msg,i)=>(
          <div key={i} style={{
            display:"flex", gap:8, alignItems:"flex-end",
            flexDirection:msg.role==="ai"?"row":"row-reverse"
          }}>
            {msg.role==="ai" && <AiAvatar/>}
            <div style={{
              maxWidth:"84%",
              background:msg.role==="ai"
                ?"linear-gradient(160deg,rgba(247,240,220,0.055),rgba(247,240,220,0.018))"
                :"linear-gradient(160deg,rgba(245,160,40,0.16),rgba(245,160,40,0.07))",
              border:msg.role==="ai"?"1px solid var(--line)":"1px solid rgba(245,160,40,0.40)",
              borderRadius:msg.role==="ai"?"4px 14px 14px 14px":"14px 4px 14px 14px",
              padding:"11px 14px",
              boxShadow:"0 4px 16px -10px rgba(0,0,0,0.5)"
            }}>
              {(msg.images||[]).length>0 && (
                <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:msg.text?10:0}}>
                  {msg.images.map((img,ii)=>(
                    <img key={ii} src={img.preview} alt="" style={{
                      maxHeight:160, maxWidth:"100%", borderRadius:8, objectFit:"cover",
                      border:"1px solid rgba(247,240,220,0.12)"
                    }}/>
                  ))}
                </div>
              )}
              {msg.hasImages && (msg.images||[]).length===0 && (
                <div style={{fontSize:11.5, color:"var(--paper-faint)", marginBottom:msg.text?8:0, display:"flex", alignItems:"center", gap:5}}>
                  <span>📸</span><span style={{fontStyle:"italic"}}>screenshots shared</span>
                </div>
              )}
              {msg.text && (
                <div style={{fontSize:13.5, color:"var(--paper-mute)", lineHeight:1.8, whiteSpace:"pre-wrap"}}>
                  {msg.text.replace(/\*\*(.*?)\*\*/g,(_,t)=>t)}
                </div>
              )}
              {msg.logData && (
                <div style={{marginTop:10, paddingTop:10, borderTop:"1px solid var(--line)"}}>
                  {msg.logSaved ? (
                    <div style={{display:"flex", alignItems:"center", gap:6, fontSize:12, color:"var(--sage)"}}>
                      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12l5 5L20 7"/></svg>
                      Saved to Log Book
                    </div>
                  ) : (
                    <button onClick={()=>saveToLog(i, msg.logData)} style={{
                      display:"flex", alignItems:"center", gap:6,
                      background:"rgba(94,201,90,0.1)", border:"1px solid rgba(94,201,90,0.35)",
                      borderRadius:8, color:"var(--sage)", fontSize:12, fontWeight:600,
                      padding:"7px 12px", cursor:"pointer", width:"100%", justifyContent:"center",
                      fontFamily:"'Space Grotesk',sans-serif", letterSpacing:"0.02em"
                    }}>
                      <span>📓</span> Save to Log Book
                    </button>
                  )}
                </div>
              )}
            </div>
          </div>
        ))}

        {/* Typing dots */}
        {loading && (
          <div style={{display:"flex", gap:8, alignItems:"flex-end"}}>
            <AiAvatar/>
            <div style={{
              background:"linear-gradient(160deg,rgba(247,240,220,0.055),rgba(247,240,220,0.018))",
              border:"1px solid var(--line)", borderRadius:"4px 14px 14px 14px",
              padding:"14px 18px", display:"flex", gap:6, alignItems:"center"
            }}>
              {[0,1,2].map(i=>(
                <div key={i} style={{
                  width:7,height:7,borderRadius:"50%",
                  background:"var(--paper-faint)",
                  animation:`bob 1.1s ease-in-out ${i*0.18}s infinite`
                }}/>
              ))}
            </div>
          </div>
        )}
        <div ref={bottomRef}/>
      </div>

      {/* Pending image thumbnails */}
      {pendingImages.length>0 && (
        <div style={{display:"flex", gap:6, flexWrap:"wrap", marginBottom:10}}>
          {pendingImages.map((img,i)=>(
            <div key={i} style={{position:"relative"}}>
              <img src={img.preview} alt="" style={{
                height:64, borderRadius:8, objectFit:"cover",
                border:"1px solid rgba(245,160,40,0.45)"
              }}/>
              <button onClick={()=>setPendingImages(prev=>prev.filter((_,ii)=>ii!==i))} style={{
                position:"absolute",top:-6,right:-6,
                width:18,height:18,borderRadius:"50%",
                background:"var(--rust)",border:"none",color:"white",
                fontSize:10,display:"grid",placeItems:"center",cursor:"pointer"
              }}>✕</button>
            </div>
          ))}
        </div>
      )}

      {/* Input row */}
      <div style={{
        display:"flex", gap:8, alignItems:"flex-end",
        padding:"10px 10px",
        background:"linear-gradient(180deg,rgba(247,240,220,0.05),rgba(247,240,220,0.02))",
        border:"1px solid var(--line)", borderRadius:14,
      }}>
        <button onClick={()=>fileRef.current?.click()} title="Attach screenshot" style={{
          width:38,height:38,borderRadius:10,flexShrink:0,
          background:"rgba(247,240,220,0.06)",border:"1px solid var(--line)",
          display:"grid",placeItems:"center",color:"var(--paper-faint)",cursor:"pointer",
          transition:"all .18s"
        }}>
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor" stroke="none"/>
            <path d="M21 15l-5-5L5 21"/>
          </svg>
        </button>
        <input ref={fileRef} type="file" accept="image/*" multiple style={{display:"none"}}
          onChange={e=>{addImages(e.target.files); e.target.value="";}}/>

        <textarea className="note" value={inputText}
          onChange={e=>setInputText(e.target.value)}
          onKeyDown={handleKey}
          placeholder="How did the run go? Shins? Energy? HR?"
          style={{flex:1, height:40, minHeight:40, padding:"9px 10px", lineHeight:1.45, fontSize:13.5, resize:"none"}}
        />

        <button onClick={send} disabled={!canSend} style={{
          width:38, height:38, borderRadius:10, flexShrink:0, border:"none", cursor:"pointer",
          background: canSend ? "var(--amber)" : "rgba(245,160,40,0.22)",
          display:"grid", placeItems:"center", color:"var(--ink)", transition:"background .18s"
        }}>
          {loading
            ? <SpinnerIco/>
            : <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/>
              </svg>
          }
        </button>
      </div>
    </div>
  );
}

/* ───────── AI COACH ───────── */
function SpinnerIco(){
  return (
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"
      style={{animation:"spin 0.75s linear infinite", flexShrink:0}}>
      <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
    </svg>
  );
}

function AICoachCard(){
  const [input, setInput]     = useState("");
  const [response, setResponse] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError]     = useState(null);

  const currentWeek = useMemo(()=>{
    for(const w of WEEKS){
      const s=new Date(WEEK1_START); s.setDate(s.getDate()+(w.w-1)*7);
      const e=new Date(s); e.setDate(s.getDate()+7);
      if(TODAY>=s && TODAY<e) return w.w;
    }
    return TODAY<WEEK1_START?1:19;
  },[]);

  const analyse = async()=>{
    if(!input.trim()) return;
    setLoading(true); setError(null); setResponse(null);

    const prompt = `You are a running coach helping a complete beginner train for the Berlin Half Marathon on October 4, 2026 using the Galloway run/walk interval method. The user is on week ${currentWeek} of 19. Background: occasional cardio 2-3x/month, shin splint risk, cross-trains with spinning, gym, yoga, Bollywood dance. Trains in Berlin with an Apple Watch.

Analyse the health data below and respond in exactly this structure:
**Assessment** — 2-3 honest sentences about their current state.
**This week's adjustments** — 3-4 bullet points, specific and actionable based on the actual numbers.
**Watch for** — any recovery or injury red flags from the data, 1-2 sentences.

Be direct and warm. Reference the actual numbers given. No generic advice. Max 350 words.

Apple Watch data:
${input}`;

    try{
      const res = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=AIzaSyAyiH73VVX4VsgrJRjOchsS7PI6atKRuks`,
        { method:"POST", headers:{"Content-Type":"application/json"},
          body:JSON.stringify({
            contents:[{parts:[{text:prompt}]}],
            generationConfig:{temperature:0.65, maxOutputTokens:700}
          })
        }
      );
      const data = await res.json();
      const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
      if(text) setResponse(text);
      else setError("No response. Try again.");
    } catch(e){
      setError("Connection failed. Check internet and try again.");
    } finally { setLoading(false); }
  };

  return (
    <div className="card grain grain-dark" style={{marginTop:14, overflow:"hidden", borderColor:"rgba(94,201,90,0.38)"}}>
      <div style={{padding:"16px 18px 14px"}}>
        <div style={{display:"flex", alignItems:"center", gap:10, marginBottom:12}}>
          <div style={{
            width:36, height:36, borderRadius:10, flexShrink:0,
            background:"rgba(94,201,90,0.12)", border:"1px solid rgba(94,201,90,0.35)",
            display:"grid", placeItems:"center", color:"var(--sage)"
          }}>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 8v4l2.5 2.5"/>
              <path d="M8 3.5C9.2 3 10.6 2.5 12 2.5" strokeWidth="2.2"/>
            </svg>
          </div>
          <div>
            <div className="mono-cap" style={{color:"var(--sage)"}}>AI Coach · Health Analysis</div>
            <div style={{fontSize:12, color:"var(--paper-dim)", marginTop:2}}>
              Gemini Flash · Week {currentWeek} context loaded
            </div>
          </div>
        </div>

        <div className="serif-i" style={{
          fontSize:13.5, color:"var(--paper-dim)", marginBottom:12, lineHeight:1.65
        }}>
          Paste anything from your Apple Watch — resting HR, HRV, sleep hours, workout summary, how your shins feel. More detail = better feedback.
        </div>

        <textarea className="note" style={{height:130}}
          value={input} onChange={e=>setInput(e.target.value)}
          placeholder={"Resting HR: 62 bpm\nHRV: 38ms\nSleep: 6h 20m\nYesterday's run: 3.4km, avg HR 136, felt hard\nShins: mild ache this morning\nEnergy today: 6/10"}
        />

        <button onClick={analyse} disabled={loading||!input.trim()} className="btn btn-amber"
          style={{marginTop:10, width:"100%", justifyContent:"center", gap:8,
            opacity:(!input.trim()||loading)?0.55:1, transition:"opacity .2s"}}>
          {loading ? <><SpinnerIco/> Analysing…</> : "Analyse with AI"}
        </button>
      </div>

      {(response||error) && (
        <div className="fade-in" style={{borderTop:"1px solid var(--line)", padding:"16px 18px", background:"rgba(0,0,0,0.25)"}}>
          {error && <div style={{color:"var(--rust)", fontSize:13.5, lineHeight:1.6}}>{error}</div>}
          {response && <>
            <div className="mono-cap" style={{color:"var(--sage)", marginBottom:14}}>
              Coach · Week {currentWeek} feedback
            </div>
            <div style={{fontSize:13.5, color:"var(--paper-mute)", lineHeight:1.85, whiteSpace:"pre-wrap"}}>
              {response.replace(/\*\*(.*?)\*\*/g, (_,t)=>t).trim()}
            </div>
          </>}
        </div>
      )}
    </div>
  );
}

/* ───────── APP ───────── */
function App(){
  const [tab, setTab] = useState("week");
  const [openWeek, setOpenWeek] = useState(1);
  const [openCross, setOpenCross] = useState(null);
  const [openDiet, setOpenDiet]   = useState(null);
  const [done, setDone] = useState({});
  const [practiceDone, setPracticeDone] = useState(false);
  const [runNotes, setRunNotes] = useState({});
  const [editingNote, setEditingNote] = useState(null);
  const [noteText, setNoteText] = useState("");
  const [saved, setSaved] = useState(false);

  useEffect(()=>{
    // Load localStorage immediately for instant first paint
    const d = lsGet("done");      if (d) try { setDone(JSON.parse(d)); } catch {}
    const n = lsGet("notes");     if (n) try { setRunNotes(JSON.parse(n)); } catch {}
    const p = lsGet("practice");  if (p === "true") setPracticeDone(true);

    // Subscribe to Firebase — keeps all devices in sync
    const handler = fbRef.on('value', snap => {
      const r = snap.val();
      if (!r) return;
      if (r.done     != null) { setDone(r.done);           lsSet("done",     JSON.stringify(r.done)); }
      if (r.notes    != null) { setRunNotes(r.notes);       lsSet("notes",    JSON.stringify(r.notes)); }
      if (r.practice != null) { setPracticeDone(!!r.practice); lsSet("practice", String(r.practice)); }
    }, ()=>{}); // silent on network error — localStorage still works

    return () => fbRef.off('value', handler);
  },[]);

  const persist = (newDone, newNotes) => {
    lsSet("done", JSON.stringify(newDone));
    lsSet("notes", JSON.stringify(newNotes));
    fbRef.update({ done: newDone, notes: newNotes }).catch(()=>{});
    setSaved(true);
    setTimeout(()=>setSaved(false), 1500);
  };

  const toggleDone = (key) => {
    const nd = {...done, [key]: !done[key]};
    setDone(nd); persist(nd, runNotes);
  };

  const saveNote = (key) => {
    const nn = {...runNotes, [key]: noteText};
    setRunNotes(nn); persist(done, nn);
    setEditingNote(null); setNoteText("");
  };

  const togglePractice = () => {
    const v = !practiceDone;
    setPracticeDone(v);
    lsSet("practice", String(v));
    fbRef.update({ practice: v }).catch(()=>{});
  };

  const totalRuns = useMemo(() => WEEKS.reduce((a,w) =>
    a + w.runs.filter(r => r.i !== "Rest" && !r.i.includes("RACE")).length, 0), []);
  const doneCount = Object.values(done).filter(Boolean).length;
  const pct = Math.round((doneCount/totalRuns) * 100);

  /* current week index */
  const currentWeek = useMemo(() => {
    for (const w of WEEKS) {
      const s = new Date(WEEK1_START); s.setDate(s.getDate() + (w.w-1)*7);
      const e = new Date(s); e.setDate(s.getDate()+7);
      if (TODAY >= s && TODAY < e) return w.w;
    }
    return TODAY < WEEK1_START ? 1 : 19;
  }, []);

  /* keep openWeek synced to current week on first mount */
  useEffect(() => { setOpenWeek(currentWeek); }, [currentWeek]);

  return (
    <div style={{minHeight:"100vh", paddingBottom:60}}>
      <Hero
        doneCount={doneCount}
        totalRuns={totalRuns}
        pct={pct}
        currentWeek={currentWeek}
        saved={saved}
      />
      <PracticeBanner done={practiceDone} onToggle={togglePractice}/>
      <TabBar tab={tab} setTab={setTab}/>

      <main className="container" style={{padding:"0 16px"}}>
        {tab === "week"   && <MyWeekTab/>}
        {tab === "plan"   && <RunPlanTab
            openWeek={openWeek} setOpenWeek={setOpenWeek}
            done={done} toggleDone={toggleDone}
            runNotes={runNotes}
            editingNote={editingNote} setEditingNote={setEditingNote}
            noteText={noteText} setNoteText={setNoteText}
            saveNote={saveNote}
          />}
        {tab === "cross"  && <TrainingTab openCross={openCross} setOpenCross={setOpenCross}/>}
        {tab === "diet"   && <DietTab openDiet={openDiet} setOpenDiet={setOpenDiet}/>}
        {tab === "prehab" && <PrehabTab/>}
        {tab === "log"    && <LogBookTab/>}
        {tab === "coach"  && <CoachTab/>}
      </main>

      <footer style={{
        padding:"30px 20px 24px", textAlign:"center",
        color:"var(--paper-faint)", fontSize:11, letterSpacing:"0.04em"
      }}>
        <div className="serif-i" style={{fontSize:18, color:"var(--paper-dim)", marginBottom:4}}>
          One run at a time.
        </div>
        21.0975 km · Berlin · 04.10.2026
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
